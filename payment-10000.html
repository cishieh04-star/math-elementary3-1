<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
<title>購物付錢遊戲($50、$100、$500、＄1000)</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  * { 
    box-sizing: border-box; 
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  } 
  
  html, body {
    margin: 0; padding: 0; 
    height: 100vh; height: 100dvh; 
    width: 100vw;
    overflow: hidden; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    background-color: #f4f4f4;
  }

  #gameContainer {
    display: flex; flex-direction: column; 
    height: 100vh; height: 100dvh; 
    width: 100%;
    max-width: 600px; margin: 0 auto; 
    position: relative;
    overflow: hidden;
  }

  #startScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #e0f2fe; color: #1e293b; z-index: 9999;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 15px; text-align: left;
  }
  .start-content-box {
    max-width: 500px; width: 100%; display: flex; flex-direction: column; align-items: center; margin: auto;
  }
  #startScreen h1 { font-size: 24px; color: #0284c7; margin: 0 0 12px 0; text-align: center; }
  
  .intro-card {
    background: #ffffff; border: 2px solid #cbd5e1;
    border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; width: 100%;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }
  .intro-card h3 { margin: 0 0 4px 0; font-size: 14px; color: #0f172a; }
  .intro-card ul { margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.4; color: #334155; }
  .intro-card li { margin-bottom: 3px; }

  .start-btn { 
    font-size: 22px; font-weight: bold; margin-top: 10px; padding: 14px 30px; 
    background: #2563eb; color: #fff; border: none; border-radius: 15px; 
    cursor: pointer; box-shadow: 0 4px 15px rgba(37,99,235,0.3);
    width: 100%; max-width: 280px; text-align: center;
  }
  .start-btn:active { transform: scale(0.95); }

  #overflowScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(239, 68, 68, 0.9); color: #fff; z-index: 8888;
    display: none; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 20px;
  }
  #overflowScreen h2 { font-size: 30px; margin-bottom: 10px; }
  #overflowScreen p { font-size: 18px; margin-bottom: 20px; }
  .refund-btn {
    font-size: 22px; font-weight: bold; padding: 14px 30px;
    background: #ffffff; color: #dc2626; border: none; border-radius: 15px;
    cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .refund-btn:active { transform: scale(0.95); }

  .header {
    padding: 8px 12px; text-align: center; background: #fff;
    flex: 0 0 auto; 
    box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
  }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .box-icon { font-size: 26px; line-height: 1; }
  .target-display { font-size: 20px; font-weight: bold; color: #d32f2f; }
  
  .header-right { display: flex; align-items: center; gap: 8px; }
  .score-display { font-size: 15px; font-weight: bold; color: #334155; background: #f1f5f9; padding: 5px 8px; border-radius: 8px; }

  .pause-btn {
    font-size: 15px; font-weight: bold; padding: 6px 12px;
    background: #f59e0b; color: white; border: none; border-radius: 10px;
    cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }
  .pause-btn:active { transform: scale(0.95); }

  #warningMsg { font-size: 14px; font-weight: bold; color: #e65100; height: 18px; background: #fff; text-align: center; flex-shrink: 0; }

  .drop-field {
    flex: 1 1 auto; 
    margin: 6px 10px; padding: 8px;
    border: 3px dashed #aaa; background: #eef; border-radius: 15px;
    position: relative;
    overflow: hidden;
    touch-action: none; 
  }

  .tray {
    height: 95px;
    flex: 0 0 auto; 
    margin: 0 10px 6px 10px; padding: 8px;
    border: 2px solid #cbd5e1; background: #ffffff; border-radius: 12px;
    display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }

  .wallet {
    flex: 0 0 auto; 
    display: flex; justify-content: center; align-items: center;
    background: #cfd8dc; box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom)) 10px; 
    font-size: 17px; font-weight: bold; color: #334155;
  }

  .money-item {
    display: flex; justify-content: center; align-items: center; 
    font-weight: bold; cursor: pointer; text-align: center;
    box-shadow: 1px 3px 5px rgba(0,0,0,0.3); transition: transform 0.1s;
  }
  .money-item:active { transform: scale(0.9); box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
  
  .money-1000 { background-color: #6366f1; color: #fff; border: 2px solid #4338ca; border-radius: 10px; }
  .money-500  { background-color: #f43f5e; color: #fff; border: 2px solid #be123c; border-radius: 10px; }
  .money-100  { background-color: #0ea5e9; color: #fff; border: 2px solid #0369a1; border-radius: 8px; }
  .money-50   { background-color: #eab308; color: #78350f; border: 2px solid #ca8a04; border-radius: 50%; }

  .drop-field .money-item {
    position: absolute;
    width: 80px; height: 55px; font-size: 18px;
    animation: fall linear forwards;
    z-index: 10;
  }
  .drop-field .money-50 {
    width: 60px; height: 60px; border-radius: 50%; font-size: 18px;
  }

  @keyframes fall {
    0% { top: -65px; }
    100% { top: 240px; }
  }

  .tray .money-item { width: 46px; height: 38px; font-size: 12px; border-radius: 6px; }
  .tray .money-50 { width: 38px; height: 38px; font-size: 12px; border-radius: 50%; }
</style>
</head>
<body>

  <div id="startScreen">
    <div class="start-content-box">
      <h1>🪙 購物付錢遊戲($50、$100、$500、＄1000)</h1>

      <div class="intro-card">
        <h3>📖 操作使用說明</h3>
        <ul>
          <li><strong>步驟一 (看目標)：</strong>觀察左上角提示的「要付金額」，每次只掉落**兩種**錢幣。</li>
          <li><strong>步驟二 (點擊收集)：</strong>方塊掉落速度已調慢，方便從容思考與點擊！</li>
          <li><strong>步驟三 (循序漸進)：</strong>遊戲從簡單的小數字開始，逐漸挑戰大金額！</li>
        </ul>
      </div>

      <button class="start-btn" id="startBtn">▶ 點擊開始遊戲</button>
    </div>
  </div>

  <div id="overflowScreen">
    <h2>⚠️ 哎呀，金額超過囉！</h2>
    <p>你收集的錢超過目標金額了～</p>
    <button class="refund-btn" onclick="refundAndResume()">🔄 全部退回，重新開始</button>
  </div>

  <div id="gameContainer">
    <div class="header">
      <div class="header-left">
        <div class="box-icon">🎁</div>
        <div class="target-display">要付 <span id="displayTarget">?</span> 元</div>
      </div>
      <div class="header-right">
        <div class="score-display">已完成: <span id="successCount">0</span> 關</div>
        <button class="pause-btn" id="pauseBtn" onclick="togglePause()">⏸ 暫停</button>
      </div>
    </div>
    <div id="warningMsg"></div>
    
    <div class="drop-field" id="dropField"></div>
    <div class="tray" id="trayCoins"></div>

    <div class="wallet" id="wallet">
      已收集金額：<span id="currentAmount">0</span> 元
    </div>
  </div>

<script>
  let count1000 = 0; 
  let count500 = 0;  
  let count100 = 0;  
  let count50 = 0;   
  let currentTarget = 0;
  let successCount = 0; 
  let audioUnlocked = false; 
  let isWinning = false;
  let isPaused = false;
  let dropInterval = null;
  let activeCoins = [];
  let currentAllowedTypes = [50, 100]; 

  const displayTarget = document.getElementById('displayTarget');
  const successCountSpan = document.getElementById('successCount');
  const trayCoins = document.getElementById('trayCoins');
  const dropField = document.getElementById('dropField');
  const startScreen = document.getElementById('startScreen');
  const overflowScreen = document.getElementById('overflowScreen');
  const currentAmountSpan = document.getElementById('currentAmount');
  const warningMsg = document.getElementById('warningMsg');
  const pauseBtn = document.getElementById('pauseBtn');
  const startBtnEl = document.getElementById('startBtn');
  
  let audioCtx = null;
  function initAudio() {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass && !audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    } catch (e) {}
  }

  function playTone(freq, type, duration, vol = 0.5) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = type; 
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function playDropSound() { playTone(400, 'square', 0.1, 0.2); }
  function playPickupSound() { playTone(800, 'sine', 0.1, 0.3); }
  function playErrorSound() {
    playTone(150, 'sawtooth', 0.2, 0.4);
    setTimeout(() => playTone(100, 'sawtooth', 0.3, 0.4), 150);
  }
  function playCheerSound() {
    playTone(523.25, 'sine', 0.2, 0.5); 
    setTimeout(() => playTone(659.25, 'sine', 0.2, 0.5), 150); 
    setTimeout(() => playTone(783.99, 'sine', 0.3, 0.5), 300); 
    setTimeout(() => playTone(1046.50, 'square', 0.5, 0.4), 450); 
  }

  function speakText(text, speedRate) {
    if (!audioUnlocked || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel(); 
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = speedRate; 
      window.speechSynthesis.speak(utterance);
    } catch(e) {}
  }

  startBtnEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    startGame();
  });

  function startGame() {
    initAudio();
    audioUnlocked = true;

    if ('speechSynthesis' in window) {
      try {
        let unlockSpeech = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(unlockSpeech);
      } catch(e) {}
    }

    startScreen.style.display = 'none';
    successCount = 0; 
    successCountSpan.innerText = successCount;
    nextQuestion();
  }

  function nextQuestion() {
    isWinning = false;
    isPaused = false;
    pauseBtn.innerText = "⏸ 暫停";
    overflowScreen.style.display = 'none';
    
    const pairs = [
      [50, 100],   
      [50, 100],   
      [100, 500],  
      [100, 500],  
      [500, 1000], 
      [100, 1000]  
    ];
    let pairIndex = Math.floor(successCount / 2) % pairs.length;
    currentAllowedTypes = pairs[pairIndex];

    let t1 = currentAllowedTypes[0];
    let t2 = currentAllowedTypes[1];

    let c1 = Math.floor(Math.random() * 3) + 1; 
    let c2 = Math.floor(Math.random() * 3) + 1; 
    
    if(successCount > 4) {
      c1 = Math.floor(Math.random() * 4) + 1;
      c2 = Math.floor(Math.random() * 4) + 1;
    }

    currentTarget = (c1 * t1) + (c2 * t2);
    displayTarget.innerText = currentTarget;
    
    count1000 = 0;
    count500 = 0;
    count100 = 0;
    count50 = 0;
    warningMsg.innerText = "";
    renderTray(); 
    
    if (dropInterval) clearInterval(dropInterval);
    activeCoins.forEach(c => c.remove());
    activeCoins = [];

    // 掉落頻率拉長到每 3.5 秒掉落一個，避免畫面太擁擠
    dropInterval = setInterval(() => {
      if (!isWinning && !isPaused) spawnFallingCoin();
    }, 3500);

    setTimeout(() => speakText(`要付，${currentTarget} 元`, 0.85), 300);
  }

  function togglePause() {
    if (isWinning) return;
    isPaused = !isPaused;

    if (isPaused) {
      pauseBtn.innerText = "▶ 繼續";
      pauseBtn.style.background = "#16a34a";
      warningMsg.innerText = "⏸️ 遊戲已暫停，可以慢慢思考喔！";
      activeCoins.forEach(c => {
        c.style.animationPlayState = 'paused';
      });
    } else {
      pauseBtn.innerText = "⏸ 暫停";
      pauseBtn.style.background = "#f59e0b";
      warningMsg.innerText = "";
      activeCoins.forEach(c => {
        c.style.animationPlayState = 'running';
      });
    }
  }

  function spawnFallingCoin() {
    if (isPaused) return;
    
    let coinType = currentAllowedTypes[Math.floor(Math.random() * currentAllowedTypes.length)];

    const coinEl = document.createElement('div');
    if (coinType === 1000) {
      coinEl.className = 'money-item money-1000';
      coinEl.innerText = '$1000';
    } else if (coinType === 500) {
      coinEl.className = 'money-item money-500';
      coinEl.innerText = '$500';
    } else if (coinType === 100) {
      coinEl.className = 'money-item money-100';
      coinEl.innerText = '$100';
    } else {
      coinEl.className = 'money-item money-50';
      coinEl.innerText = '$50';
    }

    const randomX = Math.random() * (dropField.clientWidth - 80);
    coinEl.style.left = randomX + 'px';
    
    // 【速度調整】將掉落時間大幅拉長到 12.0 ~ 18.0 秒，讓方塊非常緩慢地落下
    const duration = 12.0 + Math.random() * 6.0;
    coinEl.style.animationDuration = duration + 's';

    const handleCoinTouch = (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (isWinning || isPaused) return;

      let totalAmount = (count1000 * 1000) + (count500 * 500) + (count100 * 100) + (count50 * 50);

      if (totalAmount + coinType > currentTarget) {
        playErrorSound();
        triggerOverflowPause();
      } else {
        warningMsg.innerText = "";
        if (coinType === 1000) count1000++;
        else if (coinType === 500) count500++;
        else if (coinType === 100) count100++;
        else if (coinType === 50) count50++;

        playDropSound();
        renderTray();
      }
      coinEl.remove();
      activeCoins = activeCoins.filter(item => item !== coinEl);
    };

    coinEl.addEventListener('pointerdown', handleCoinTouch);

    coinEl.addEventListener('animationend', () => {
      coinEl.remove();
      activeCoins = activeCoins.filter(item => item !== coinEl);
    });

    dropField.appendChild(coinEl);
    activeCoins.push(coinEl);
  }

  function triggerOverflowPause() {
    isPaused = true;
    playErrorSound();
    speakText("金額超過囉，請退回重新開始！", 1.0);

    activeCoins.forEach(c => {
      c.style.animationPlayState = 'paused';
    });

    overflowScreen.style.display = 'flex';
  }

  function refundAndResume() {
    playPickupSound();
    count1000 = 0;
    count500 = 0;
    count100 = 0;
    count50 = 0;
    renderTray();
    
    activeCoins.forEach(c => c.remove());
    activeCoins = [];

    overflowScreen.style.display = 'none';
    isPaused = false;
    pauseBtn.innerText = "⏸ 暫停";
    pauseBtn.style.background = "#f59e0b";
  }

  function removeCoin(val) {
    if (isWinning || isPaused) return;
    if (val === 1000 && count1000 > 0) count1000--;
    else if (val === 500 && count500 > 0) count500--;
    else if (val === 100 && count100 > 0) count100--;
    else if (val === 50 && count50 > 0) count50--;
    
    warningMsg.innerText = "";
    playPickupSound();
    renderTray(); 
  }

  function renderTray() {
    let totalAmount = (count1000 * 1000) + (count500 * 500) + (count100 * 100) + (count50 * 50);
    trayCoins.innerHTML = ''; 
    currentAmountSpan.innerText = totalAmount;

    for(let i=0; i<count1000; i++) {
      let c = document.createElement('div');
      c.className = 'money-item money-1000';
      c.innerText = '1000';
      let act = (e) => { if(e) e.preventDefault(); removeCoin(1000); };
      c.addEventListener('pointerdown', act);
      trayCoins.appendChild(c);
    }

    for(let i=0; i<count500; i++) {
      let c = document.createElement('div');
      c.className = 'money-item money-500';
      c.innerText = '500';
      let act = (e) => { if(e) e.preventDefault(); removeCoin(500); };
      c.addEventListener('pointerdown', act);
      trayCoins.appendChild(c);
    }

    for(let i=0; i<count100; i++) {
      let c = document.createElement('div');
      c.className = 'money-item money-100';
      c.innerText = '100';
      let act = (e) => { if(e) e.preventDefault(); removeCoin(100); };
      c.addEventListener('pointerdown', act);
      trayCoins.appendChild(c);
    }

    for(let i=0; i<count50; i++) {
      let c = document.createElement('div');
      c.className = 'money-item money-50';
      c.innerText = '50';
      let act = (e) => { if(e) e.preventDefault(); removeCoin(50); };
      c.addEventListener('pointerdown', act);
      trayCoins.appendChild(c);
    }

    if (totalAmount === currentTarget && currentTarget > 0) {
      isWinning = true; 
      if (dropInterval) clearInterval(dropInterval);
      activeCoins.forEach(c => c.remove());
      activeCoins = [];

      successCount++;
      successCountSpan.innerText = successCount;

      playCheerSound(); 
      speakText(`${totalAmount} 元，答對了！`, 1.0); 
      
      confetti({
        particleCount: 150, spread: 80, origin: { y: 0.6 },
        colors: ['#FFD700', '#ff0000', '#00ff00', '#0000ff']
      });

      setTimeout(nextQuestion, 3500);
    } else if (totalAmount < currentTarget && totalAmount > 0) {
      speakText(`${totalAmount} 元`, 1.3); 
    }
  }
</script>
</body>
</html>
