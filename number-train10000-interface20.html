<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>10,000以內的數字互動遊戲(間隔20)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        } 

        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fdfbf7, #e0f2fe); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            touch-action: manipulation;
        }

        .main-wrapper {
            width: 100%;
            max-width: 580px;
            height: 100%;
            max-height: 100dvh;
            background: #ffffff;
            border-radius: 0;
            border: none;
            padding: 8px 10px;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        @media (min-width: 520px) {
            .main-wrapper {
                border-radius: 20px;
                border: 4px solid #cbd5e1;
                max-height: 96vh;
                height: auto;
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
                margin: auto;
            }
        }

        #home-screen { 
            text-align: center; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100%;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
            padding: 10px;
        }

        #game-ui { 
            text-align: center; 
            width: 100%; 
            height: 100%;
            display: none; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        #status-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            width: 100%; 
            font-size: 15px; 
            font-weight: bold; 
            color: #2c3e50; 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 4px; 
            flex-shrink: 0;
        }

        .status-left {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* 速度調整群組樣式 (+/-) */
        .speed-control-group {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 13px;
        }
        .speed-btn {
            background: #3b82f6;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .speed-btn:active { background: #1d4ed8; transform: scale(0.92); }

        /* 聽題目按鈕樣式 */
        #repeat-audio-btn {
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(14,165,233,0.3);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #repeat-audio-btn:active {
            background: #0284c7;
            transform: scale(0.95);
        }
        
        /* 視覺提示區：火車車廂軌道區 */
        #visual-area { 
            height: 110px; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            background: linear-gradient(to bottom, #e0f2fe 70%, #94a3b8 70%, #94a3b8 76%, #f8fafc 76%);
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
            padding: 4px;
            position: relative;
            flex-shrink: 0;
        }

        /* 車廂造型設計 */
        .train-carriage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .train-box { 
            width: 68px; 
            height: 60px; 
            background: #3b82f6; 
            border: 3px solid #1e40af;
            border-radius: 10px 10px 5px 5px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            z-index: 2;
        }

        /* 車廂上的窗戶 */
        .train-window {
            width: 56px;
            height: 22px;
            background: #e0f2fe;
            border: 2px solid #1e40af;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px; 
            font-weight: bold;
            color: #1e293b;
        }

        /* 車輪 */
        .train-wheels {
            display: flex;
            gap: 22px;
            margin-top: -3px;
            z-index: 3;
        }
        .wheel {
            width: 12px;
            height: 12px;
            background: #334155;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
        }

        /* 車廂之間的連接器勾環 */
        .train-connector {
            width: 10px;
            height: 5px;
            background: #475569;
            margin-bottom: 22px;
        }

        /* 挖空目標車廂樣式 */
        .train-box.target {
            background: #eab308;
            border-color: #854d0e;
        }
        .train-box.target .train-window {
            background: #fef08a;
            border-color: #854d0e;
            color: #b45309;
        }
        
        #question { font-size: 18px; font-weight: bold; color: #1e293b; margin: 2px 0; flex-shrink: 0; }
        #feedback { font-size: 16px; color: #e67e22; font-weight: bold; min-height: 22px; margin: 2px 0; flex-shrink: 0; }
        
        /* 掉落答案遊戲區域 */
        #drop-game-container {
            position: relative;
            width: 100%;
            height: 110px;
            background: #f1f5f9;
            border: 3px solid #cbd5e1;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* 掉落的數字球選項 */
        .falling-option {
            position: absolute;
            width: 64px;
            height: 64px;
            background: radial-gradient(circle, #38bdf8 60%, #0284c7 100%);
            border: 3px solid #0369a1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px; 
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            animation: fall linear forwards;
            z-index: 999;
            pointer-events: auto;
        }
        .falling-option:active { transform: scale(0.9); }

        @keyframes fall {
            0% { top: -64px; }
            100% { top: 55px; }
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        button#start-btn, .control-btn { 
            padding: 12px 35px; 
            font-size: 18px; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(59,130,246,0.3);
            font-weight: bold;
            touch-action: manipulation;
            z-index: 10;
        }
        button#start-btn:active, .control-btn:active { background: #2563eb; transform: scale(0.95); }
        
        #pause-btn {
            background: #d97706;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="home-screen">
        <h1 style="font-size: 22px; color: #1e293b; margin: 5px 0;">🚂 10,000以內的數字互動遊戲(間隔20)</h1>
        <p style="color: #0284c7; font-size: 13px; font-weight: bold; margin: 0 0 10px 0;">🌟 專屬練習：每次增加或減少 20 的規律！</p>
        
        <div style="background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; width: 100%; text-align: left;">
            <p style="margin: 0 0 4px 0; font-size: 13px; font-weight: bold; color: #334155;">📖 操作使用說明：</p>
            <ul style="margin: 0; padding-left: 18px; font-size: 12px; color: #64748b; line-height: 1.4;">
                <li><strong>觀察間隔 20 的規律：</strong>注意上方車廂數字，掌握每次增加或減少 20 的變化。</li>
                <li><strong>調整方塊掉落速度：</strong>隨時點擊頂部的 <code style="background:#e2e8f0; padding:1px 4px; border-radius:4px;">+</code> 或 <code style="background:#e2e8f0; padding:1px 4px; border-radius:4px;">-</code> 調整速度！</li>
                <li><strong>點擊數字球通關：</strong>當畫面上方掉落正確答案時，點擊即可完成闖關！</li>
                <li><strong>隨時聽題目：</strong>右上角常駐「🔊 聽題目」按鈕，點擊即可重新朗讀！</li>
            </ul>
        </div>

        <button id="start-btn" onclick="initGame()">開始玩遊戲</button>
    </div>

    <div id="game-ui">
        <div id="status-bar">
            <div class="status-left">
                <div id="timer">時間: 00:00</div>
                <div id="score">闖關: 0</div>
                <div class="speed-control-group">
                    <span>方塊掉落速度</span>
                    <button class="speed-btn" onclick="adjustSpeed(-1)" title="減慢速度">-</button>
                    <span id="speed-display" style="min-width: 32px; text-align: center; font-weight: bold; color: #1e293b;">正常</span>
                    <button class="speed-btn" onclick="adjustSpeed(1)" title="加快速度">+</button>
                </div>
            </div>
            <button id="repeat-audio-btn" onclick="repeatCurrentQuestion()">🔊 聽題目</button>
        </div>
        
        <div id="visual-area"></div>
        <div id="question">火車空格是多少呢？</div>
        <div id="feedback">注意看！數字掉下來囉！</div>
        
        <div id="drop-game-container"></div>

        <div class="btn-group">
            <button id="pause-btn" class="control-btn" onclick="togglePause()">暫停遊戲</button>
        </div>
    </div>
</div>

    <script>
        let currentAns, score = 0;
        let gameInterval = null;
        let nextQuestionTimeout = null;
        let activeOptions = [];
        let isAnswered = false;
        let isPaused = false;
        let timerInterval = null;
        let totalSeconds = 0; 
        let audioCtx = null;
        let optionsArr = [];
        let trainSequence = [];
        let currentQuestionText = "看看火車車廂，空格的數字是多少呢？";

        // 速度等級設定
        let speedLevel = 2; 
        const speedDurations = [0, 6.0, 4.0, 2.5, 1.5];
        const speedNames = ["", "慢速", "正常", "快速", "極速"];

        function adjustSpeed(delta) {
            speedLevel += delta;
            if (speedLevel < 1) speedLevel = 1;
            if (speedLevel > 4) speedLevel = 4;

            document.getElementById('speed-display').innerText = speedNames[speedLevel];
            
            activeOptions.forEach(el => {
                el.style.animationDuration = speedDurations[speedLevel] + 's';
            });
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'zh-TW';
                window.speechSynthesis.speak(msg);
            } catch(e) {}
        }

        function repeatCurrentQuestion() {
            speak(currentQuestionText);
        }

        function playSuccessSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(350, audioCtx.currentTime);
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime + 0.15); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.3);  
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playErrorSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function initGame() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass && !audioCtx) {
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}

            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            
            score = 0;
            totalSeconds = 0;
            isPaused = false;
            
            const pauseBtn = document.getElementById('pause-btn');
            pauseBtn.innerText = "暫停遊戲";
            pauseBtn.style.backgroundColor = "#d97706";

            document.getElementById('score').innerText = `闖關: ${score}`;
            startTimer();
            loadQuestion();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    totalSeconds++;
                    let m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                    let s = (totalSeconds % 60).toString().padStart(2, '0');
                    document.getElementById('timer').innerText = `時間: ${m}:${s}`;
                }
            }, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pause-btn');
            
            if (isPaused) {
                pauseBtn.innerText = "繼續遊戲";
                pauseBtn.style.backgroundColor = "#16a34a";
                document.getElementById('feedback').innerText = "⏸️ 遊戲已暫停，慢慢思考喔！";
                activeOptions.forEach(el => el.style.animationPlayState = 'paused');
            } else {
                pauseBtn.innerText = "暫停遊戲";
                pauseBtn.style.backgroundColor = "#d97706";
                document.getElementById('feedback').innerText = "▶️ 遊戲繼續！加油！";
                activeOptions.forEach(el => el.style.animationPlayState = 'running');
                if (isAnswered) loadQuestion();
            }
        }

        // 核心題型產生器：將間隔設定為 20
        function loadQuestion() {
            isAnswered = false;
            if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);

            if (!isPaused) {
                document.getElementById('feedback').innerText = "觀察數字的變化，找出空格數字！";
            }
            
            activeOptions.forEach(el => el.remove());
            activeOptions = [];
            if (gameInterval) clearInterval(gameInterval);

            // 間隔設定為 20
            let step = 20;

            // 隨機產生千位、百位、十位與個位 (個位數保持為 0 或配合 20 的倍數，確保尾數一致)
            let baseTh = Math.floor(Math.random() * 8) + 1; // 1000 ~ 8000
            let baseH = Math.floor(Math.random() * 9) + 1;   // 100 ~ 900
            let baseT = Math.floor(Math.random() * 4) * 2;   // 確保十位為雙數或配合 20 變化的基底
            let baseU = 0; // 尾數固定為 0 或一致，以符合間隔 20
            let startNum = baseTh * 1000 + baseH * 100 + Math.floor(Math.random() * 45) * 20 + 10;

            // 隨機決定是「遞增(+20)」還是「遞減(-20)」
            let isAscending = Math.random() < 0.5;
            let actualStep = isAscending ? step : -step;

            trainSequence = [];
            for (let i = 0; i < 4; i++) {
                let val = startNum + (i * actualStep);
                // 確保數值在合理範圍內
                if (val < 1000) val += 100;
                if (val > 9900) val -= 100;
                trainSequence.push(val);
            }

            let blankIndex = Math.floor(Math.random() * 4);
            currentAns = trainSequence[blankIndex];

            renderTrain(trainSequence, blankIndex);
            
            currentQuestionText = `看看火車車廂，空格的數字是多少呢？`;
            speak(currentQuestionText);

            // 產生豐富的干擾選項（以 20 為單位的錯覺選項）
            let options = new Set([currentAns]);
            while(options.size < 4) {
                let offsetMultiplier = (Math.floor(Math.random() * 5) - 2);
                let randVal = currentAns + (offsetMultiplier * step);
                if (randVal > 1000 && randVal <= 9999 && randVal !== currentAns) {
                    options.add(randVal);
                } else {
                    options.add(currentAns + 20);
                }
            }
            optionsArr = Array.from(options).sort(() => Math.random() - 0.5);

            let index = 0;
            gameInterval = setInterval(() => {
                if (isPaused) return; 
                if (isAnswered) {
                    clearInterval(gameInterval);
                    return;
                }
                if (index >= optionsArr.length) index = 0;
                spawnFallingOption(optionsArr[index]);
                index++;
            }, 2000);
        }

        function renderTrain(seq, blankIdx) {
            let area = document.getElementById('visual-area');
            area.innerHTML = '';
            
            seq.forEach((num, idx) => {
                let carriage = document.createElement('div');
                carriage.className = 'train-carriage';

                let box = document.createElement('div');
                box.className = 'train-box';
                
                let windowDiv = document.createElement('div');
                windowDiv.className =
