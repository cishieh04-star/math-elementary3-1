<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>數學冒險：10000以內火車過山洞篇（間隔20）</title>
    <!-- 引入灑花特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        } 

        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fdfbf7, #e0f2fe); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            touch-action: manipulation;
        }

        .main-wrapper {
            width: 100%;
            max-width: 580px;
            height: 100%;
            max-height: 100dvh;
            background: #ffffff;
            border-radius: 0;
            border: none;
            padding: 8px 10px;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        @media (min-width: 520px) {
            .main-wrapper {
                border-radius: 20px;
                border: 4px solid #cbd5e1;
                max-height: 96vh;
                height: auto;
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
                margin: auto;
            }
        }

        #home-screen { 
            text-align: center; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100%;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
            padding: 10px;
        }

        #game-ui { 
            text-align: center; 
            width: 100%; 
            height: 100%;
            display: none; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        #status-bar { 
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            width: 100%; 
            font-size: 16px; 
            font-weight: bold; 
            color: #2c3e50; 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 4px; 
            flex-shrink: 0;
        }
        
        /* 視覺提示區：逼真的火車車廂軌道區 */
        #visual-area { 
            height: 110px; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            background: linear-gradient(to bottom, #e0f2fe 70%, #94a3b8 70%, #94a3b8 76%, #f8fafc 76%);
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
            padding: 4px;
            position: relative;
            flex-shrink: 0;
        }

        /* 車廂造型設計 */
        .train-carriage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .train-box { 
            width: 68px; 
            height: 60px; 
            background: #3b82f6; 
            border: 3px solid #1e40af;
            border-radius: 10px 10px 5px 5px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            z-index: 2;
        }

        /* 車廂上的窗戶 */
        .train-window {
            width: 56px;
            height: 22px;
            background: #e0f2fe;
            border: 2px solid #1e40af;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px; 
            font-weight: bold;
            color: #1e293b;
        }

        /* 車輪 */
        .train-wheels {
            display: flex;
            gap: 22px;
            margin-top: -3px;
            z-index: 3;
        }
        .wheel {
            width: 12px;
            height: 12px;
            background: #334155;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
        }

        /* 車廂之間的連接器勾環 */
        .train-connector {
            width: 10px;
            height: 5px;
            background: #475569;
            margin-bottom: 22px;
        }

        /* 挖空目標車廂樣式 */
        .train-box.target {
            background: #eab308;
            border-color: #854d0e;
        }
        .train-box.target .train-window {
            background: #fef08a;
            border-color: #854d0e;
            color: #b45309;
        }
        
        #question { font-size: 18px; font-weight: bold; color: #1e293b; margin: 2px 0; flex-shrink: 0; }
        #feedback { font-size: 16px; color: #e67e22; font-weight: bold; min-height: 22px; margin: 2px 0; flex-shrink: 0; }
        
        /* 掉落答案遊戲區域 */
        #drop-game-container {
            position: relative;
            width: 100%;
            height: 110px;
            background: #f1f5f9;
            border: 3px solid #cbd5e1;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* 掉落的數字球選項 */
        .falling-option {
            position: absolute;
            width: 64px;
            height: 64px;
            background: radial-gradient(circle, #38bdf8 60%, #0284c7 100%);
            border: 3px solid #0369a1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px; 
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            animation: fall linear forwards;
            z-index: 999;
            pointer-events: auto;
        }
        .falling-option:active { transform: scale(0.9); }

        @keyframes fall {
            0% { top: -64px; }
            100% { top: 55px; }
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        button#start-btn, .control-btn { 
            padding: 10px 20px; 
            font-size: 16px; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(59,130,246,0.3);
            font-weight: bold;
            touch-action: manipulation;
            z-index: 10;
        }
        button#start-btn:active, .control-btn:active { background: #2563eb; transform: scale(0.95); }
        
        .speak-bar-btn {
            background: #0ea5e9;
            padding: 6px 12px;
            font-size: 14px;
        }
        .speak-bar-btn:active { background: #0284c7; }

        #pause-btn {
            background: #d97706;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- 首頁畫面 -->
    <div id="home-screen">
        <h1 style="font-size: 22px; color: #1e293b; margin: 5px 0;">🚂 10000以內：火車過山洞（間隔20）</h1>
        <p style="color: #0284c7; font-size: 13px; font-weight: bold; margin: 0 0 10px 0;">🌟 遊戲特色：10000以內每次增加20 × 趣味掉落球 × 語音互動學習！</p>
        
        <div style="background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; width: 100%; text-align: left;">
            <p style="margin: 0 0 4px 0; font-size: 13px; font-weight: bold; color: #334155;">📖 操作使用說明：</p>
            <ul style="margin: 0; padding-left: 18px; font-size: 12px; color: #64748b; line-height: 1.4;">
                <li><strong>觀察車廂規律：</strong>注意上方火車車廂的數字，掌握每次增加 20 的排列順序。</li>
                <li><strong>找出空格答案：</strong>思考被問號 <code style="background:#e2e8f0; padding:1px 4px; border-radius:4px;">?</code> 遮住的車廂應該填入什麼數字。</li>
                <li><strong>🔊 聽題目按鈕：</strong>若手機聽不到聲音，隨時點擊右上角「🔊 聽題目」按鈕即可重新朗讀！</li>
                <li><strong>點擊數字球通關：</strong>當畫面上方掉落數字球時，點擊正確的數字即可完成闖關！</li>
            </ul>
        </div>

        <button id="start-btn" style="padding: 12px 35px; font-size: 18px;">開始玩遊戲</button>
    </div>

    <!-- 遊戲中畫面 -->
    <div id="game-ui">
        <div id="status-bar">
            <div id="timer">時間: 00:00</div>
            <div id="score">闖關: 0</div>
            <button class="control-btn speak-bar-btn" onclick="manualSpeak()">🔊 聽題目</button>
        </div>
        
        <!-- 火車車廂視覺區 -->
        <div id="visual-area"></div>
        <div id="question">火車空格是多少呢？</div>
        <div id="feedback">注意看！數字掉下來囉！</div>
        
        <!-- 掉落答案區域 -->
        <div id="drop-game-container"></div>

        <!-- 暫停按鈕區 -->
        <div class="btn-group">
            <button id="pause-btn" class="control-btn" onclick="togglePause()">暫停遊戲</button>
        </div>
    </div>
</div>

    <script>
        let currentAns, score = 0;
        let gameInterval = null;
        let nextQuestionTimeout = null;
        let activeOptions = [];
        let isAnswered = false;
        let isPaused = false;
        let timerInterval = null;
        let totalSeconds = 0; 
        let audioCtx = null;
        let optionsArr = [];
        let trainSequence = [];
        let currentUtterance = null; // 全域常駐語音變數，防止 iPhone 記憶體回收
        let lastSpokenText = "";

        function speak(text) {
            lastSpokenText = text;
            if (!('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                currentUtterance = new SpeechSynthesisUtterance(text);
                currentUtterance.lang = 'zh-TW';
                currentUtterance.rate = 0.85;
                currentUtterance.volume = 1.0;
                
                const voices = window.speechSynthesis.getVoices();
                const femaleVoice = voices.find(v => v.lang.includes('zh-TW') && (v.name.includes('Mei-Jia') || v.name.toLowerCase().includes('female')));
                if (femaleVoice) currentUtterance.voice = femaleVoice;
                
                window.speechSynthesis.speak(currentUtterance);
            } catch(e) {}
        }

        function manualSpeak() {
            if (lastSpokenText) {
                speak(lastSpokenText);
            } else {
                speak("看看火車車廂，空格的數字是多少呢？");
            }
        }

        function playSuccessSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(350, audioCtx.currentTime);
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime + 0.15); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.3);  
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playErrorSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        const startBtnEl = document.getElementById('start-btn');
        startBtnEl.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            initGame();
        });

        function initGame() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass && !audioCtx) {
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}

            // 【iPhone 專用強制解鎖語音通道】
            if ('speechSynthesis' in window) {
                try {
                    window.speechSynthesis.cancel();
                    let unlockSpeech = new SpeechSynthesisUtterance("遊戲開始");
                    unlockSpeech.volume = 0.01;
                    window.speechSynthesis.speak(unlockSpeech);
                } catch(e) {}
            }

            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            score = 0;
            totalSeconds = 0;
            isPaused = false;
            
            const pauseBtn = document.getElementById('pause-btn');
            pauseBtn.innerText = "暫停遊戲";
            pauseBtn.style.backgroundColor = "#d97706";

            document.getElementById('score').innerText = `闖關: ${score}`;
            startTimer();
            loadQuestion();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    totalSeconds++;
                    let m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                    let s = (totalSeconds % 60).toString().padStart(2, '0');
                    document.getElementById('timer').innerText = `時間: ${m}:${s}`;
                }
            }, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pause-btn');
            
            if (isPaused) {
                pauseBtn.innerText = "繼續遊戲";
                pauseBtn.style.backgroundColor = "#16a34a";
                document.getElementById('feedback').innerText = "⏸️ 遊戲已暫停，慢慢思考喔！";
                activeOptions.forEach(el => el.style.animationPlayState = 'paused');
            } else {
                pauseBtn.innerText = "暫停遊戲";
                pauseBtn.style.backgroundColor = "#d97706";
                document.getElementById('feedback').innerText = "▶️ 遊戲繼續！加油！";
                activeOptions.forEach(el => el.style.animationPlayState = 'running');
                if (isAnswered) loadQuestion();
            }
        }

        function loadQuestion() {
            isAnswered = false;
            if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);

            if (!isPaused) {
                document.getElementById('feedback').innerText = "火車車廂少了一個數字，找找看！";
            }
            
            activeOptions.forEach(el => el.remove());
            activeOptions = [];
            if (gameInterval) clearInterval(gameInterval);

            let step = 20;
            let maxStart = 9920; 
            let randomMultiplier = Math.floor(Math.random() * (maxStart / step)) + 1; 
            let startNum = randomMultiplier * step;
            
            trainSequence = [];
            for (let i = 0; i < 4; i++) {
                trainSequence.push(startNum + i * step);
            }

            let blankIndex = Math.floor(Math.random() * 4);
            currentAns = trainSequence[blankIndex];

            renderTrain(trainSequence, blankIndex);
            speak(`看看火車車廂，空格的數字是多少呢？`);

            let options = new Set([currentAns]);
            while(options.size < 4) {
                let randMult = Math.floor(Math.random() * (maxStart / step)) + 1;
                let randStart = randMult * step;
                let randVal = randStart + Math.floor(Math.random() * 4) * step;
                if (randVal <= 10000) {
                    options.add(randVal);
                }
            }
            optionsArr = Array.from(options).sort(() => Math.random() - 0.5);

            let index = 0;
            gameInterval = setInterval(() => {
                if (isPaused) return; 
                if (isAnswered) {
                    clearInterval(gameInterval);
                    return;
                }
                if (index >= optionsArr.length) index = 0;
                spawnFallingOption(optionsArr[index]);
                index++;
            }, 2000);
        }

        function renderTrain(seq, blankIdx) {
            let area = document.getElementById('visual-area');
            area.innerHTML = '';
            
            seq.forEach((num, idx) => {
                let carriage = document.createElement('div');
                carriage.className = 'train-carriage';

                let box = document.createElement('div');
                box.className = 'train-box';
                
                let windowDiv = document.createElement('div');
                windowDiv.className = 'train-window';

                if (idx === blankIdx) {
                    box.classList.add('target');
                    windowDiv.innerText = '?';
                    windowDiv.id = 'trainTarget';
                } else {
                    windowDiv.innerText = num;
                }
                box.appendChild(windowDiv);
                carriage.appendChild(box);

                let wheels = document.createElement('div');
                wheels.className = 'train-wheels';
                wheels.innerHTML = '<div class="wheel"></div><div class="wheel"></div>';
                carriage.appendChild(wheels);

                area.appendChild(carriage);

                if (idx < seq.length - 1) {
                    let connector = document.createElement('div');
                    connector.className = 'train-connector';
                    area.appendChild(connector);
                }
            });
        }

        function spawnFallingOption(val) {
            if (isAnswered) return;
            const container = document.getElementById('drop-game-container');
            const el = document.createElement('div');
            el.className = 'falling-option';
            el.innerText = val;

            const randomX = Math.random() * (container.clientWidth - 64);
            el.style.left = randomX + 'px';
            const duration = 4 + Math.random();
            el.style.animationDuration = duration + 's';

            if (isPaused) el.style.animationPlayState = 'paused';

            let isHandled = false;
            const handleSelect = function(e) {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                if (isAnswered || isPaused || isHandled) return;
                isHandled = true;

                if (val === currentAns) {
                    isAnswered = true;
                    score++;
                    document.getElementById('score').innerText = `闖關: ${score}`;
                    
                    playSuccessSound();
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });

                    let targetBox = document.getElementById('trainTarget');
                    if (targetBox) {
                        targetBox.innerText = currentAns;
                        targetBox.style.background = '#86efac';
                        targetBox.style.borderColor = '#16a34a';
                        targetBox.style.color = '#166534';
                        targetBox.parentElement.style.background = '#22c55e';
                        targetBox.parentElement.style.borderColor = '#15803d';
                    }

                    document.getElementById('feedback').innerText = "🎉 太棒了！火車順利開走了！";
                    speak(`答對了，就是${currentAns}！`);

                    clearInterval(gameInterval);
                    activeOptions.forEach(opt => opt.remove());
                    activeOptions = [];

                    nextQuestionTimeout = setTimeout(() => {
                        if (!isPaused) loadQuestion();
                    }, 3000);
                } else {
                    playErrorSound();
                    speak("再算算看喔！");
                    document.getElementById('feedback').innerText = "❌ 數字不對喔，再試一次！";
                    el.style.transition = "opacity 0.3s";
                    el.style.opacity = "0";
                    setTimeout(() => el.remove(), 300);
                }
            };

            el.addEventListener('pointerdown', handleSelect);

            el.addEventListener('animationend', () => {
                el.remove();
                activeOptions = activeOptions.filter(item => item !== el);
            });

            container.appendChild(el);
            activeOptions.push(el);
        }
    </script>
</body>
</html>
