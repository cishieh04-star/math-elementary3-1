<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>基礎乘法遊戲(1-4)</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  * { 
    box-sizing: border-box; 
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  } 
  
  body, button, .money-item, .falling-option, .lantern-option {
    cursor: pointer !important;
  }

  html, body {
    margin: 0; padding: 0; 
    height: 100vh; height: 100dvh; 
    width: 100vw;
    overflow: hidden; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    background-color: #f4f4f4;
    touch-action: manipulation;
  }

  #gameContainer {
    display: flex; flex-direction: column; 
    height: 100vh; height: 100dvh; 
    width: 100%;
    max-width: 600px; margin: 0 auto; 
    position: relative;
    overflow: hidden;
  }

  #startScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #e0f2fe; color: #1e293b; z-index: 9999;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 15px; text-align: left;
  }
  .start-content-box {
    max-width: 500px; width: 100%; display: flex; flex-direction: column; align-items: center; margin: auto;
  }
  #startScreen h1 { font-size: 22px; color: #0284c7; margin: 0 0 10px 0; text-align: center; }
  
  .intro-card {
    background: #ffffff; border: 2px solid #cbd5e1;
    border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; width: 100%;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }
  .intro-card h3 { margin: 0 0 4px 0; font-size: 14px; color: #0f172a; }
  .intro-card ul { margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.4; color: #334155; }
  .intro-card li { margin-bottom: 3px; }

  .start-btn { 
    font-size: 20px; font-weight: bold; margin-top: 5px; padding: 12px 30px; 
    background: #2563eb; color: #fff; border: none; border-radius: 15px; 
    cursor: pointer; box-shadow: 0 4px 15px rgba(37,99,235,0.3);
    width: 100%; max-width: 280px; text-align: center;
  }
  .start-btn:active { transform: scale(0.95); }

  #quizScreen, #quizScreen3 {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.9); color: #fff; z-index: 8888;
    display: none; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 10px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .quiz-box {
    background: #ffffff; color: #1e293b; width: 100%; max-width: 480px;
    border-radius: 16px; padding: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    max-height: 95vh; display: flex; flex-direction: column; align-items: center;
  }
  .quiz-box h2 { color: #2563eb; margin: 0 0 5px 0; font-size: 18px; }
  .quiz-box p { font-size: 15px; font-weight: bold; margin: 6px 0; }
  
  .hammer-tool-bar {
    display: flex; align-items: center; gap: 8px; margin: 4px 0;
    background: #fef3c7; border: 2px dashed #f59e0b; padding: 4px 10px; border-radius: 10px;
  }
  .hammer-icon { font-size: 20px; animation: bounceHammer 1s infinite alternate; }
  @keyframes bounceHammer {
    0% { transform: rotate(-15deg); }
    100% { transform: rotate(15deg); }
  }

  .tetris-drop-area {
    width: 100%; height: 210px; background: #f8fafc; border: 3px dashed #94a3b8;
    border-radius: 12px; position: relative; overflow: hidden; margin: 6px 0;
    flex-shrink: 0;
  }
  
  .falling-option {
    position: absolute; width: 90%; max-width: 340px; height: 46px; background: #f59e0b; color: #fff;
    font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center;
    border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    left: 50%; transform: translateX(-50%);
    animation: dropDown linear infinite;
    padding: 5px;
  }
  .falling-option:active { transform: translateX(-50%) scale(0.9); background-color: #dc2626; }

  .lantern-option {
    position: absolute; width: 85px; height: 50px; background: #dc2626; color: #fef08a;
    font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center;
    border-radius: 50% 50% 40% 40%; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    border: 2px solid #b91c1c;
    animation: dropDown linear infinite;
    padding: 5px;
  }
  .lantern-option::before {
    content: '🏮';
    position: absolute; top: -12px; font-size: 14px;
  }
  .lantern-option:active { transform: scale(0.9); background-color: #b91c1c; }

  @keyframes dropDown {
    0% { top: -60px; }
    100% { top: 200px; }
  }

  #overflowScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(239, 68, 68, 0.9); color: #fff; z-index: 8889;
    display: none; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 20px;
  }
  #overflowScreen h2 { font-size: 26px; margin-bottom: 10px; }
  #overflowScreen p { font-size: 17px; margin-bottom: 20px; }
  .refund-btn {
    font-size: 18px; font-weight: bold; padding: 12px 25px;
    background: #ffffff; color: #dc2626; border: none; border-radius: 15px;
    cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  .header {
    padding: 8px 12px; text-align: center; background: #fff;
    flex: 0 0 auto; 
    box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
  }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .box-icon { font-size: 24px; line-height: 1; }
  .target-display { font-size: 18px; font-weight: bold; color: #d32f2f; }
  
  .header-right { display: flex; align-items: center; gap: 8px; }
  .score-display { font-size: 14px; font-weight: bold; color: #334155; background: #f1f5f9; padding: 4px 8px; border-radius: 8px; }

  .pause-btn {
    font-size: 14px; font-weight: bold; padding: 6px 10px;
    background: #f59e0b; color: white; border: none; border-radius: 8px;
    cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  #warningMsg { font-size: 13px; font-weight: bold; color: #e65100; height: 18px; background: #fff; text-align: center; flex-shrink: 0; }

  .drop-field {
    flex: 1 1 auto; 
    margin: 4px 10px; padding: 8px;
    border: 3px dashed #aaa; background: #eef; border-radius: 15px;
    position: relative; overflow: hidden; touch-action: manipulation; 
  }

  .tray {
    height: 75px; flex: 0 0 auto; 
    margin: 0 10px 4px 10px; padding: 6px;
    border: 2px solid #cbd5e1; background: #ffffff; border-radius: 12px;
    display: flex; flex-wrap: wrap; align-content: flex-start; gap: 5px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }

  .wallet {
    flex: 0 0 auto; 
    display: flex; justify-content: center; align-items: center;
    background: #cfd8dc; box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom)) 10px; 
    font-size: 16px; font-weight: bold; color: #334155;
  }

  .money-item {
    display: flex; justify-content: center; align-items: center; 
    font-weight: bold; cursor: pointer; text-align: center;
    box-shadow: 1px 3px 5px rgba(0,0,0,0.3); transition: transform 0.1s;
  }
  .money-item:active { transform: scale(0.9); }
  
  .money-custom { background-color: #0ea5e9; color: #fff; border: 2px solid #0369a1; border-radius: 8px; }

  .drop-field .money-item {
    position: absolute;
    width: 75px; height: 50px; font-size: 17px; z-index: 10;
  }

  @keyframes fall {
    0% { top: -60px; }
    100% { top: 220px; }
  }

  .tray .money-item { width: 38px; height: 32px; font-size: 11px; border-radius: 6px; }

  .tap-hammer-effect {
    position: absolute; font-size: 32px; pointer-events: none; z-index: 99999;
    animation: hammerTapAnim 0.4s ease-out forwards;
  }
  @keyframes hammerTapAnim {
    0% { transform: scale(0.5) rotate(-30deg); opacity: 1; }
    50% { transform: scale(1.3) rotate(15deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 0; }
  }
</style>
</head>
<body>

  <div id="startScreen">
    <div class="start-content-box">
      <h1>🪙 基礎乘法遊戲(1-4)</h1>

      <div class="intro-card">
        <h3>📖 操作說明</h3>
        <ul>
          <li><strong>第一頁 (付錢)：</strong>點擊掉落的數字方塊來湊出金額！</li>
          <li><strong>第二頁 (選算式)：</strong>點擊選出正確的乘法算式！</li>
          <li><strong>第三頁 (接小燈籠)：</strong>看著算式，點選緩慢掉落的正確答案數字！</li>
        </ul>
      </div>

      <button class="start-btn" id="startBtn">▶ 點擊開始遊戲</button>
    </div>
  </div>

  <!-- 第二畫面：選算式 -->
  <div id="quizScreen">
    <div class="quiz-box">
      <h2>🧩 第二畫面：選乘法算式</h2>
      <div class="hammer-tool-bar">
        <span class="hammer-icon">🔨</span>
        <span style="font-size: 12px; font-weight: bold; color: #b45309;">請點擊正確的乘法算式！</span>
      </div>
      <p id="quizQuestionText">請選擇正確的乘法橫式：</p>
      <div class="tetris-drop-area" id="tetrisDropArea"></div>
      <div id="quizFeedback" style="font-size: 13px; font-weight: bold; color: #dc2626; height: 18px;"></div>
    </div>
  </div>

  <!-- 第三畫面：看算式，小燈籠緩慢掉落選總額 -->
  <div id="quizScreen3">
    <div class="quiz-box">
      <h2>🏮 第三畫面：接小燈籠算總額</h2>
      <div class="hammer-tool-bar">
        <span class="hammer-icon">🏮</span>
        <span style="font-size: 12px; font-weight: bold; color: #b45309;">下方算式等於多少？請點擊正確的小燈籠！</span>
      </div>
      <p id="quizQuestionText3" style="font-size: 22px; color: #dc2626; margin: 10px 0; font-weight: bold;">?</p>
      <div class="tetris-drop-area" id="tetrisDropArea3"></div>
      <div id="quizFeedback3" style="font-size: 13px; font-weight: bold; color: #dc2626; height: 18px;"></div>
    </div>
  </div>

  <div id="overflowScreen">
    <h2>⚠️ 哎呀，金額超過囉！</h2>
    <p>你支付的錢超過目標金額了～</p>
    <button class="refund-btn" id="refundBtn">🔄 全部退回，重新開始</button>
  </div>

  <div id="gameContainer">
    <div class="header">
      <div class="header-left">
        <div class="box-icon">🎁</div>
        <div class="target-display">要付 <span id="displayTarget">?</span> 元</div>
      </div>
      <div class="header-right">
        <div class="score-display">已完成: <span id="successCount">0</span> 關</div>
        <button class="pause-btn" id="pauseBtn">⏸ 暫停</button>
      </div>
    </div>
    
    <div class="hammer-tool-bar" style="margin: 4px 10px 0 10px; justify-content: center; padding: 4px;">
      <span class="hammer-icon" style="font-size: 16px;">🔨</span>
      <span style="font-size: 12px; font-weight: bold; color: #b45309;">第一頁：點擊掉落方塊來付錢！</span>
    </div>
    <div id="warningMsg"></div>
    
    <div class="drop-field" id="dropField"></div>
    <div class="tray" id="trayCoins"></div>

    <div class="wallet" id="wallet">
      已支付金額：<span id="currentAmount">0</span> 元
    </div>
  </div>

<script>
  let collectedCount = 0;   
  let currentTarget = 0;
  let currentCoinValue = 1; 
  let requiredCount = 0;    
  let successCount = 0; 
  let audioUnlocked = false; 
  let isAnswering = false;
  let isPaused = false;
  let dropInterval = null;
  let activeCoins = [];

  const displayTarget = document.getElementById('displayTarget');
  const successCountSpan = document.getElementById('successCount');
  const trayCoins = document.getElementById('trayCoins');
  const dropField = document.getElementById('dropField');
  const startScreen = document.getElementById('startScreen');
  const overflowScreen = document.getElementById('overflowScreen');
  const quizScreen = document.getElementById('quizScreen');
  const quizScreen3 = document.getElementById('quizScreen3');
  const tetrisDropArea = document.getElementById('tetrisDropArea');
  const tetrisDropArea3 = document.getElementById('tetrisDropArea3');
  const quizQuestionText = document.getElementById('quizQuestionText');
  const quizQuestionText3 = document.getElementById('quizQuestionText3');
  const quizFeedback = document.getElementById('quizFeedback');
  const quizFeedback3 = document.getElementById('quizFeedback3');
  const currentAmountSpan = document.getElementById('currentAmount');
  const warningMsg = document.getElementById('warningMsg');
  const pauseBtn = document.getElementById('pauseBtn');
  const refundBtn = document.getElementById('refundBtn');
  const startBtnEl = document.getElementById('startBtn');
  
  let audioCtx = null;

  function initAudio() {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass && !audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    } catch (e) {}
  }

  function playTone(freq, type, duration, vol = 0.5) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = type; 
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function playHammerSound() { playTone(600, 'sawtooth', 0.12, 0.4); }
  function playPickupSound() { playTone(800, 'sine', 0.1, 0.3); }
  function playErrorSound() {
    playTone(150, 'sawtooth', 0.2, 0.4);
    setTimeout(() => playTone(100, 'sawtooth', 0.3, 0.4), 150);
  }
  function playCheerSound() {
    playTone(523.25, 'sine', 0.2, 0.5); 
    setTimeout(() => playTone(659.25, 'sine', 0.2, 0.5), 150); 
    setTimeout(() => playTone(783.99, 'sine', 0.3, 0.5), 300); 
    setTimeout(() => playTone(1046.50, 'square', 0.5, 0.4), 450); 
  }

  function speakText(text, speedRate) {
    if (!audioUnlocked || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel(); 
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = speedRate; 
      window.speechSynthesis.speak(utterance);
    } catch(e) {}
  }

  function showHammerEffect(x, y) {
    const hammer = document.createElement('div');
    hammer.className = 'tap-hammer-effect';
    hammer.innerText = '🔨';
    hammer.style.left = (x - 20) + 'px';
    hammer.style.top = (y - 30) + 'px';
    document.body.appendChild(hammer);
    setTimeout(() => hammer.remove(), 400);
  }

  startBtnEl.addEventListener('pointerdown', (e) => { e.preventDefault(); startGame(); });
  startBtnEl.addEventListener('click', (e) => { startGame(); });

  pauseBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); togglePause(); });
  refundBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); refundAndResume(); });

  function startGame() {
    initAudio();
    audioUnlocked = true;

    if ('speechSynthesis' in window) {
      try {
        let unlockSpeech = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(unlockSpeech);
      } catch(e) {}
    }

    startScreen.style.display = 'none';
    successCount = 0; 
    successCountSpan.innerText = successCount;
    nextQuestion();
  }

  function nextQuestion() {
    isAnswering = false;
    isPaused = false;
    quizScreen.style.display = 'none';
    quizScreen3.style.display = 'none';
    overflowScreen.style.display = 'none';
    pauseBtn.innerText = "⏸ 暫停";
    
    const possibleValues = [1, 2, 3, 4];
    currentCoinValue = possibleValues[Math.floor(Math.random() * possibleValues.length)];
    requiredCount = Math.floor(Math.random() * 4) + 2; 
    currentTarget = currentCoinValue * requiredCount;

    displayTarget.innerText = currentTarget;
    
    collectedCount = 0;
    warningMsg.innerText = "";
    renderTray(); 
    
    if (dropInterval) clearInterval(dropInterval);
    activeCoins.forEach(c => c.remove());
    activeCoins = [];

    dropInterval = setInterval(() => {
      if (!isAnswering && !isPaused) spawnFallingCoin();
    }, 3500);

    setTimeout(() => speakText(`要付，${currentTarget} 元`, 0.85), 300);
  }

  function togglePause() {
    if (isAnswering) return;
    isPaused = !isPaused;

    if (isPaused) {
      pauseBtn.innerText = "▶ 繼續";
      pauseBtn.style.background = "#16a34a";
      warningMsg.innerText = "⏸️ 遊戲已暫停，可以慢慢思考喔！";
      activeCoins.forEach(c => c.style.animationPlayState = 'paused');
    } else {
      pauseBtn.innerText = "⏸ 暫停";
      pauseBtn.style.background = "#f59e0b";
      warningMsg.innerText = "";
      activeCoins.forEach(c => c.style.animationPlayState = 'running');
    }
  }

  function spawnFallingCoin() {
    if (isPaused) return;
    
    const coinEl = document.createElement('div');
    coinEl.className = 'money-item money-custom';
    coinEl.innerText = `$${currentCoinValue}`;

    const randomX = Math.random() * (dropField.clientWidth - 80);
    coinEl.style.left = randomX + 'px';
    
    const duration = 11.0 + Math.random() * 3.0;
    coinEl.style.animationDuration = duration + 's';
    coinEl.style.animationName = 'fall';
    coinEl.style.animationTimingFunction = 'linear';
    coinEl.style.animationFillMode = 'forwards';

    const handleCoinTouch = (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (isAnswering || isPaused) return;

      const clientX = e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2;
      const clientY = e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2;
      showHammerEffect(clientX, clientY);

      playHammerSound();
      let totalAmount = collectedCount * currentCoinValue;

      if (totalAmount + currentCoinValue > currentTarget) {
        playErrorSound();
        triggerOverflowPause();
      } else {
        warningMsg.innerText = "";
        collectedCount++;
        renderTray();
      }
      coinEl.remove();
      activeCoins = activeCoins.filter(item => item !== coinEl);
    };

    coinEl.addEventListener('pointerdown', handleCoinTouch);
    coinEl.addEventListener('click', handleCoinTouch);

    coinEl.addEventListener('animationend', () => {
      coinEl.remove();
      activeCoins = activeCoins.filter(item => item !== coinEl);
    });

    dropField.appendChild(coinEl);
    activeCoins.push(coinEl);
  }

  function triggerOverflowPause() {
    isPaused = true;
    playErrorSound();
    speakText("金額超過囉，請退回重新開始！", 1.0);

    activeCoins.forEach(c => c.style.animationPlayState = 'paused');
    overflowScreen.style.display = 'flex';
  }

  function refundAndResume() {
    playPickupSound();
    collectedCount = 0;
    renderTray(); 
    
    activeCoins.forEach(c => c.remove());
    activeCoins = [];

    overflowScreen.style.display = 'none';
    isPaused = false;
    pauseBtn.innerText = "⏸ 暫停";
    pauseBtn.style.background = "#f59e0b";
  }

  function removeCoin() {
    if (isAnswering || isPaused) return;
    if (collectedCount > 0) collectedCount--;
    
    warningMsg.innerText = "";
    playPickupSound();
    renderTray(); 
  }

  function renderTray() {
    let totalAmount = collectedCount * currentCoinValue;
    trayCoins.innerHTML = ''; 
    currentAmountSpan.innerText = totalAmount;

    for(let i=0; i<collectedCount; i++) {
      let c = document.createElement('div');
      c.className = 'money-item money-custom';
      c.innerText = `${currentCoinValue}`;
      let act = (e) => { if(e) e.preventDefault(); removeCoin(); };
      c.addEventListener('pointerdown', act);
      c.addEventListener('click', act);
      trayCoins.appendChild(c);
    }

    if (totalAmount === currentTarget && currentTarget > 0) {
      isAnswering = true; 
      if (dropInterval) clearInterval(dropInterval);
      activeCoins.forEach(c => c.remove());
      activeCoins = [];

      playCheerSound();
      speakText(`${totalAmount} 元，支付完成！請進入第二個畫面選算式`, 1.0);

      setTimeout(() => {
        triggerTetrisQuiz();
      }, 2000);

    } else if (totalAmount < currentTarget && totalAmount > 0) {
      speakText(`${totalAmount} 元`, 1.3); 
    }
  }

  // 第二畫面：選算式
  function triggerTetrisQuiz() {
    quizScreen.style.display = 'flex';
    tetrisDropArea.innerHTML = '';
    quizFeedback.innerText = '';

    let correctStr = `${currentCoinValue} × ${collectedCount} = ${currentTarget}`;

    let options = [correctStr];
    while(options.length < 4) {
      let rndVal1 = Math.floor(Math.random() * 4) + 1;
      let rndVal2 = Math.floor(Math.random() * 4) + 2;
      let wrongAns = rndVal1 * rndVal2;
      let wrongStr = `${rndVal1} × ${rndVal2} = ${wrongAns}`;
      if (!options.includes(wrongStr) && wrongAns !== currentTarget) {
        options.push(wrongStr);
      }
    }
    options.sort(() => Math.random() - 0.5);

    quizQuestionText.innerHTML = `總金額 ${currentTarget} 元（${collectedCount} 個 ${currentCoinValue} 元），哪一個是正確的乘法橫式？`;
    speakText(`總金額 ${currentTarget} 元，請選擇正確的乘法算式！`, 1.0);

    options.forEach((optStr, index) => {
      let optionEl = document.createElement('div');
      optionEl.className = 'falling-option';
      optionEl.innerText = optStr;
      
      let startTop = -50 - (index * 60);
      optionEl.style.top = startTop + 'px';
      optionEl.style.animationDuration = '12.0s';
      optionEl.style.animationDelay = (index * 3.0) + 's';
      optionEl.style.animationIterationCount = 'infinite';

      const selectOption = (e) => {
        e.preventDefault();
        e.stopPropagation();
        
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2;
        const clientY = e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2;
        showHammerEffect(clientX, clientY);

        playHammerSound();

        if (optStr === correctStr) {
          document.querySelectorAll('.falling-option').forEach(el => {
            if (el !== optionEl) el.remove();
          });

          let computedTop = window.getComputedStyle(optionEl).top;
          optionEl.style.animation = 'none';
          optionEl.style.top = computedTop;
          optionEl.style.backgroundColor = '#16a34a'; 
          optionEl.style.transform = 'translateX(-50%) scale(1.05)';
          optionEl.style.zIndex = '99';
          optionEl.innerText = `🎉 ${correctStr}`;

          quizFeedback.style.color = '#16a34a';
          quizFeedback.innerText = `🎉 答對了！ ${correctStr}！準備進入第三個畫面！`;
          playCheerSound();
          
          // 完整朗讀鼓勵與敘述
          speakText(`答對了！${currentCoinValue} 乘以 ${collectedCount} 等於 ${currentTarget}！接下來進入第三個畫面！`, 0.9);

          confetti({
            particleCount: 120, spread: 70, origin: { y: 0.6 },
            colors: ['#FFD700', '#ff0000', '#00ff00', '#0000ff']
          });

          // 將切換到第三頁的時間從 3 秒延長至 6 秒，讓語音完整念完
          setTimeout(() => {
            quizScreen.style.display = 'none';
            triggerQuizScreen3(`${currentCoinValue} × ${collectedCount} = `);
          }, 6000);
        } else {
          playErrorSound();
          quizFeedback.style.color = '#dc2626';
          quizFeedback.innerText = `❌ ${optStr} 不對喔，被槌子敲碎消失了！`;
          speakText("再想一下喔", 1.0);
          optionEl.remove();
        }
      };

      optionEl.addEventListener('pointerdown', selectOption);
      optionEl.addEventListener('click', selectOption);
      tetrisDropArea.appendChild(optionEl);
    });
  }

  // 第三畫面：小燈籠掉落
  function triggerQuizScreen3(equationWithoutAns) {
    quizScreen3.style.display = 'flex';
    tetrisDropArea3.innerHTML = '';
    quizFeedback3.innerText = '';

    quizQuestionText3.innerHTML = `${equationWithoutAns} ?`;
    
    let cleanEquationSpeech = equationWithoutAns.replace('×', '乘以');
    speakText(`請看算式，${cleanEquationSpeech} 等於多少呢？請接住掉落的小燈籠！`, 1.0);

    let correctAnsVal = currentTarget;
    let options = [correctAnsVal];
    
    while(options.length < 4) {
      let offset = (Math.floor(Math.random() * 4) - 2) * currentCoinValue;
      if (offset === 0) offset = 1;
      let wrongVal = correctAnsVal + offset;
      if (wrongVal <= 0) wrongVal = correctAnsVal + 2;
      if (!options.includes(wrongVal)) {
        options.push(wrongVal);
      }
    }
    options.sort(() => Math.random() - 0.5);

    let leftPositions = [15, 38, 62, 85]; 

    options.forEach((val, index) => {
      let optionEl = document.createElement('div');
      optionEl.className = 'lantern-option'; 
      optionEl.innerText = val;
      
      optionEl.style.left = leftPositions[index] + '%';
      
      let startTop = -60 - (index * 40);
      optionEl.style.top = startTop + 'px';
      
      optionEl.style.animationDuration = '14.0s';
      optionEl.style.animationDelay = (index * 3.2) + 's';
      optionEl.style.animationIterationCount = 'infinite';

      const selectOption3 = (e) => {
        e.preventDefault();
        e.stopPropagation();
        
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2;
        const clientY = e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2;
        showHammerEffect(clientX, clientY);

        playHammerSound();

        if (val === correctAnsVal) {
          document.querySelectorAll('#quizScreen3 .lantern-option').forEach(el => {
            if (el !== optionEl) el.remove();
          });

          let computedLeft = window.getComputedStyle(optionEl).left;
          let computedTop = window.getComputedStyle(optionEl).top;
          optionEl.style.animation = 'none';
          optionEl.style.left = computedLeft;
          optionEl.style.top = computedTop;
          optionEl.style.backgroundColor = '#16a34a'; 
          optionEl.style.borderColor = '#15803d';
          optionEl.style.transform = 'translateX(-50%) scale(1.05)';
          optionEl.style.zIndex = '99';
          optionEl.innerText = `🏮 ${currentTarget}`;

          quizFeedback3.style.color = '#16a34a';
          quizFeedback3.innerText = `🎉 答對了！ ${equationWithoutAns} ${currentTarget}！`;
          playCheerSound();
          
          speakText(`太棒了！${cleanEquationSpeech} ${currentTarget}！恭喜完成所有挑戰！`, 0.9);

          confetti({
            particleCount: 150, spread: 80, origin: { y: 0.6 },
            colors: ['#FFD700', '#ff0000', '#00ff00', '#0000ff']
          });

          successCount++;
          successCountSpan.innerText = successCount;

          setTimeout(() => {
            quizScreen3.style.display = 'none';
            nextQuestion();
          }, 7000);
        } else {
          playErrorSound();
          quizFeedback3.style.color = '#dc2626';
          quizFeedback3.innerText = `❌ ${val} 不對喔，小燈籠飛走了！再想一想！`;
          speakText("再想一下喔", 1.0);
          optionEl.remove();
        }
      };

      optionEl.addEventListener('pointerdown', selectOption3);
      optionEl.addEventListener('click', selectOption3);
      tetrisDropArea3.appendChild(optionEl);
    });
  }
</script>
</body>
