<style>

.it.x::after{content:"";position:absolute;inset:8%;background:
  linear-gradient(45deg,transparent 44%,#e03131 44%,#e03131 56%,transparent 56%),

.nx::before{content:"👆";position:absolute;left:50%;top:92%;transform:translateX(-50%);font-size:.6em;line-height:1;z-index:5;pointer-events:none}
@keyframes pul{from{box-shadow:0 0 0 0 rgba(240,140,0,.7)}to{box-shadow:0 0 0 7px rgba(240,140,0,0)}}

  background-image:linear-gradient(#f0d9b0,#f0d9b0),linear-gradient(#f0d9b0,#f0d9b0);background-size:100% 2px,2px 100%;background-position:center,center;background-repeat:no-repeat}

.bigbtn{font-size:clamp(20px,5.2vmin,34px);font-weight:900;padding:.1em .9em;border-radius:16px;border:3px solid #2f9e44;background:#b2f2bb;line-height:2}
.lvg{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:min(96%,560px)}

#pause{position:fixed;inset:0;background:rgba(40,25,5,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:9;color:#fff;font-size:clamp(28px,8vmin,56px);font-weight:900}

.wheel{position:relative;flex:none}

  linear-gradient(0deg,transparent calc(50% - 2px),#f59f00 calc(50% - 2px),#f59f00 calc(50% + 2px),transparent calc(50% + 2px)),
  linear-gradient(60deg,transparent calc(50% - 2px),#f59f00 calc(50% - 2px),#f59f00 calc(50% + 2px),transparent calc(50% + 2px)),
  linear-gradient(120deg,transparent calc(50% - 2px),#f59f00 calc(50% - 2px),#f59f00 calc(50% + 2px),transparent calc(50% + 2px))}

.head span{font-size:26px;font-weight:900;color:#d9480f;line-height:1;transform:translateY(75%)}
.pit{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:6px 4px}
.ball{width:clamp(42px,13vmin,64px);height:clamp(42px,13vmin,64px);border-radius:50%;border:3px solid #8a6020;font-size:clamp(22px,7vmin,34px);font-weight:900;padding:0;background:radial-gradient(circle at 30% 30%,#fff,#ffd43b)}

 #bar{padding:2px}#bar button{padding:3px 8px}#prog{padding:0}

 .lvg{grid-template-columns:repeat(5,1fr);width:98%}.lvg button{padding:4px 2px;font-size:12px}
 .need{line-height:1.15}.need b{font-size:1.2em}.tip{line-height:1.25}

 .home h1{font-size:20px}.home .bigbtn{display:inline-block;width:31%;font-size:15px;padding:0 2px}.home .sub{font-size:12px}
 .opts.cols .opt{height:26vmin}.it,.slot{font-size:6.6vmin}.grp .it{font-size:5.4vmin}
 .conn{gap:8vmin}.card{min-height:13vmin;font-size:4vmin}.cnt{row-gap:.7em}.play{padding-bottom:1em}
 .rowb{min-height:0;padding-bottom:.6em}
}
.grp .g .gnum{width:100%;font-size:1.1em;font-weight:900;color:#d9480f;line-height:1.1}
.grp{transition:gap .7s}.grp .g{transition:border-radius .7s,background .7s,border-color .7s}

.grp.merged{gap:0;flex-wrap:nowrap;align-items:stretch}

.grp.merged .g{background:#fff9db;border-color:#f08c00;max-width:none}

.grp.merged .g:last-child{border-left-color:transparent;border-radius:0 14px 14px 0}

.yay{font-size:clamp(30px,9vmin,64px);font-weight:900;color:#2f9e44;line-height:1.8}

<div id="bar">

<script>
"use strict";
/* ---------- 注音 ---------- */
const ZY={};
("藍ㄌㄢˊ 橘ㄐㄩˊ 請ㄑㄧㄥˇ 先ㄒㄧㄢ 只ㄓˇ 同ㄊㄨㄥˊ 或ㄏㄨㄛˋ 摩ㄇㄛˊ 天ㄊㄧㄢ 輪ㄌㄨㄣˊ 拼ㄆㄧㄣ 夾ㄐㄧㄚˊ 注ㄓㄨˋ 音ㄧㄣ 題ㄊㄧˊ 目ㄇㄨˋ 中ㄓㄨㄥ 超ㄔㄠ 定ㄉㄧㄥˋ 數ㄕㄨˇ 一ㄧ 多ㄉㄨㄛ 的˙ㄉㄜ 畫ㄏㄨㄚˋ 掉ㄉㄧㄠˋ 不ㄅㄨˋ 夠ㄍㄡˋ 補ㄅㄨˇ 上ㄕㄤˋ 去ㄑㄩˋ 比ㄅㄧˇ 較ㄐㄧㄠˋ 長ㄔㄤˊ 短ㄉㄨㄢˇ 高ㄍㄠ 薄ㄅㄛˊ "+
"樣ㄧㄤˋ 連ㄌㄧㄢˊ 起ㄑㄧˇ 來ㄌㄞˊ 按ㄢˋ 照ㄓㄠˋ 順ㄕㄨㄣˋ 序ㄒㄩˋ 填ㄊㄧㄢˊ 看ㄎㄢˋ 彎ㄨㄢ 平ㄆㄧㄥˊ 面ㄇㄧㄢˋ 哪ㄋㄚˇ 個˙ㄍㄜ 東ㄉㄨㄥ 西˙ㄒㄧ 有ㄧㄡˇ "+
"合ㄏㄜˊ 是ㄕˋ 和ㄏㄢˋ 可ㄎㄜˇ 以ㄧˇ 分ㄈㄣ 成ㄔㄥˊ 前ㄑㄧㄢˊ 後ㄏㄡˋ 排ㄆㄞˊ 在ㄗㄞˋ 第ㄉㄧˋ 幾ㄐㄧˇ 從ㄘㄨㄥˊ 開ㄎㄞ 始ㄕˇ 隻ㄓ 把ㄅㄚˇ 枝ㄓ 本ㄅㄣˇ "+
"找ㄓㄠˇ 點ㄉㄧㄢˇ 圈ㄑㄩㄢ 少ㄕㄠˇ 了˙ㄌㄜ 著˙ㄓㄜ 邊ㄅㄧㄢ 手ㄕㄡˇ 指ㄓˇ 字ㄗˋ 好ㄏㄠˇ 選ㄒㄩㄢˇ 下ㄒㄧㄚˋ 全ㄑㄩㄢˊ 部ㄅㄨˋ 要ㄧㄠˋ 那ㄋㄚˋ "+
"顆ㄎㄜ 星ㄒㄧㄥ 練ㄌㄧㄢˋ 習ㄒㄧˊ 過ㄍㄨㄛˋ 關ㄍㄨㄢ 你ㄋㄧˇ 兩ㄌㄧㄤˇ 這ㄓㄜˋ 用ㄩㄥˋ 太ㄊㄞˋ 打ㄉㄚˇ 叉ㄔㄚ 到ㄉㄠˋ 剛ㄍㄤ 條ㄊㄧㄠˊ 線ㄒㄧㄢˋ 接ㄐㄧㄝ 堆ㄉㄨㄟ 放ㄈㄤˋ 靠ㄎㄠˋ 近ㄐㄧㄣˋ 圓ㄩㄢˊ 滾ㄍㄨㄣˇ 會ㄏㄨㄟˋ 動ㄉㄨㄥˋ 站ㄓㄢˋ 灰ㄏㄨㄟ 色ㄙㄜˋ 塗ㄊㄨˊ 滿ㄇㄢˇ 描ㄇㄧㄠˊ 跟ㄍㄣ 再ㄗㄞˋ").split(" ").forEach(s=>{if(s)ZY[s[0]]=s.slice(1)});
window.__miss=new Set();
function zh(c,alt){const z=alt||ZY[c],t=(z.match(/[ˊˇˋ]/)||[""])[0],b=z.replace(/[ˊˇˋ]/,"");
  return '<span class="zc">'+c+'<span class="zy">'+[...b].map(x=>"<i>"+x+"</i>").join("")+"</span>"+(t?'<span class="tn">'+t+"</span>":"")+"</span>"}
function Z(s){let o="",pv="";const A=[...String(s)];for(let i=0;i<A.length;i++){const c=A[i];
  if(c==="數"&&A[i+1]==="字"){o+=zh(c,"ㄕㄨˋ");continue}if(c==="分"&&A[i-1]==="部"){o+=zh(c,"ㄈㄣˋ");continue}
  if(ZY[c])o+=zh(c);else{if(/[一-鿿]/.test(c))window.__miss.add(c);o+=c}}return o}

/* ---------- 小工具 ---------- */
const $=id=>document.getElementById(id), stage=$("stage");

const SS=window.__noTTS?null:window.speechSynthesis;

function loadVoice(){if(!SS)return;const v=SS.getVoices();voice=v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}

/* 語音核心：新的一句一定先停掉舊的一句，不會重疊；小朋友點螢幕可以跳過正在唸的回饋 */
const fixT=t=>String(t).replace(/數(?!字)/g,"鼠").replace(/薄/g,"博");   /* 「數一數」的數要唸ㄕㄨˇ，用同音字發音 */
let spSeq=0,skipFn=null,sayAt=0;
function utter(t,cb,rate){const my=++spSeq;let d=false,to=0;const fin=()=>{if(!d){d=true;clearTimeout(to);if(skipFn===fin)skipFn=null;cb&&cb()}};
  if(!SS){to=setTimeout(fin,FAST?1:t.length*180+300);return fin}
  const go=()=>{if(my!==spSeq){fin();return}const u=new SpeechSynthesisUtterance(fixT(t));u.lang="zh-TW";if(voice)u.voice=voice;u.rate=rate||RATES[ri];u.onend=fin;u.onerror=fin;SS.speak(u)};
  to=setTimeout(fin,t.length*450/RATES[ri]+2500);
  if(SS.speaking||SS.pending){SS.cancel();setTimeout(go,80)}else go();
  return fin}
document.addEventListener("pointerdown",ev=>{if(ev.target&&ev.target.closest&&ev.target.closest("#bar"))return;if(skipFn&&!paused&&Date.now()-sayAt>350){const f=skipFn;skipFn=null;spSeq++;if(SS)SS.cancel();f()}},true);
function speak(t){if(!SS||paused)return;utter(t)}
let last="";function tell(t){last=t;idleAt=Date.now();speak(t)}
let idleAt=Date.now(),sayBusy=false;
async function say(t,g){while(paused){await raw(150);chk(g)}sayBusy=true;idleAt=Date.now();
  await new Promise(r=>{sayAt=Date.now();skipFn=utter(t,r)});
  sayBusy=false;idleAt=Date.now();chk(g);while(paused){await raw(150);chk(g)}}

function chime(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[660,880].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.18,AC.currentTime+i*.13);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+i*.13+.25);
  o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+i*.13);o.stop(AC.currentTime+i*.13+.26)})}catch(e){}}

const FONT='"BiauKai","BiauKaiTC","DFKai-SB","標楷體","Kaiti TC","KaiTi","TW-Kai","PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",sans-serif';
function traceChar(pad,c,S){return new Promise(res=>{
  pad.innerHTML="";
  if(window.__skipTrace){setTimeout(res,5);return}
  const dpr=Math.min(2,window.devicePixelRatio||1),P=Math.round(S*dpr);
  const mk=n=>{const cv=document.createElement("canvas");cv.width=cv.height=n;return cv};
  const glyphOn=(ctx,n,color)=>{ctx.fillStyle=color;ctx.font="700 "+(n*0.8)+"px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(c,n/2,n*0.53)};
  const base=mk(P),ink=mk(P),shape=mk(P);
  [base,ink].forEach(cv=>{cv.style.width=cv.style.height=S+"px";pad.appendChild(cv)});
  glyphOn(base.getContext("2d"),P,"#d5ccba");glyphOn(shape.getContext("2d"),P,"#000");
  const G=96,m=mk(G),mc=m.getContext("2d",{willReadFrequently:true});glyphOn(mc,G,"#000");
  const d=mc.getImageData(0,0,G,G).data,glyph=new Uint8Array(G*G),zone=new Uint8Array(G*G),cov=new Uint8Array(G*G);let total=0;
  for(let i=0;i<G*G;i++)if(d[i*4+3]>90){glyph[i]=1;total++}
  const ZR=8;for(let y=0;y<G;y++)for(let x=0;x<G;x++)if(glyph[y*G+x])for(let a=-ZR;a<=ZR;a++)for(let b=-ZR;b<=ZR;b++){const X=x+a,Y=y+b;if(X>=0&&Y>=0&&X<G&&Y<G)zone[Y*G+X]=1}
  const ic=ink.getContext("2d");let got=0,out=0,down=false,lx=0,ly=0,done=false;const BR=7;
  const mark=(gx,gy)=>{const cx=Math.round(gx),cy=Math.round(gy);
    if(cx<0||cy<0||cx>=G||cy>=G||!zone[cy*G+cx])out++;
    for(let a=-BR;a<=BR;a++)for(let b=-BR;b<=BR;b++){if(a*a+b*b>BR*BR)continue;const X=cx+a,Y=cy+b;if(X<0||Y<0||X>=G||Y>=G)continue;const k=Y*G+X;if(!cov[k]){cov[k]=1;if(glyph[k])got++}}};
  const reset=()=>{ic.clearRect(0,0,P,P);cov.fill(0);got=0;out=0;down=false};
  const seg=(x0,y0,x1,y1)=>{
    ic.globalCompositeOperation="source-over";ic.strokeStyle="#e8590c";ic.lineWidth=P*BR*2/G;ic.lineCap="round";ic.lineJoin="round";
    ic.beginPath();ic.moveTo(x0*dpr,y0*dpr);ic.lineTo(x1*dpr,y1*dpr);ic.stroke();
    ic.globalCompositeOperation="destination-in";ic.drawImage(shape,0,0);ic.globalCompositeOperation="source-over";
    const k=G/S,n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)*k));
    for(let i=0;i<=n;i++)mark((x0+(x1-x0)*i/n)*k,(y0+(y1-y0)*i/n)*k);
    if(out>G*1.6){reset();return}                      /* 亂畫：全部擦掉重來，沒有任何效果 */
    if(got/total>=0.86&&!done){done=true;ic.clearRect(0,0,P,P);glyphOn(ic,P,"#e8590c");chime();setTimeout(res,FAST?5:700)}};
  const pos=e=>{const r=pad.getBoundingClientRect();return [e.clientX-r.left-pad.clientLeft,e.clientY-r.top-pad.clientTop]};
  pad.onpointerdown=e=>{if(busy()||done)return;e.preventDefault();down=true;[lx,ly]=pos(e);try{pad.setPointerCapture(e.pointerId)}catch(_){}seg(lx,ly,lx,ly)};
  pad.onpointermove=e=>{if(!down||done||paused)return;e.preventDefault();const [x,y]=pos(e);seg(lx,ly,x,y);lx=x;ly=y};
  pad.onpointerup=pad.onpointercancel=()=>{down=false};
  window.__tr={glyph,G,S,c}})}

async function clawGame(K,g){const chars=[...K.kw];let firstChar=true;
  const seen=new Set();
  for(const i of K.tr){const c=chars[i];if(seen.has(c))continue;seen.add(c);const z=ZY[c],tone=(z.match(/[ˊˇˋ˙]/)||[""])[0],light=tone==="˙",base=[...z.replace(/[ˊˇˋ˙]/g,"")],seq=base.concat(tone?[tone]:[]);

    let lightSlot=null;if(light){lightSlot=el("span","zs","˙");col.appendChild(lightSlot)}
    const slots=base.map(x=>{const s=el("span","zs",x);col.appendChild(s);return s});zb.appendChild(col);
    if(light)slots.push(lightSlot);else if(tone){const s=el("span","zs zt",tone);zb.appendChild(s);slots.push(s)}

    const balls=shuf(seq.concat(shuf(pool).slice(0,6-seq.length))).map(x=>{const b=el("button","ball",x);b.dataset.s=x;pit.appendChild(b);return b});

    tell(firstChar?(opt("hint")?"夾注音。看灰色的注音，把一樣的注音球，一個一個夾起來":"夾注音。這個字的注音是什麼？把注音球，一個一個夾起來"):"很好！再夾下一個字的注音");firstChar=false;
    for(let k=0;k<seq.length;k++){slots[k].classList.add("cur");

async function sequence(box,seq,blanks){let first=true;

/* ---------- 題目 ---------- */
const FRUIT=["🍎","🍊","🍓","🍋","🍇","🐟","🌼","⭐","🎈","🍪"];
const ANI=[["🐯","老虎"],["🐰","兔子"],["🐲","龍"],["🐍","蛇"],["🐴","馬"],["🐵","猴子"],["🐑","羊"],["🐔","雞"],["🐶","狗"],["🐷","豬"]];

function qCount(kw,v){const n=R(3,8),e=pick(FRUIT);
  if(v===1){const m=R(2,4),o=pick(FRUIT.filter(x=>x!==e)),mix=shuf(Array(n).fill(e).concat(Array(m).fill(o)));
    return{kw:"數一數",chunks:["數一數","，",e+"有幾個","？"],done:"數一數，一共有"+n+"個",say:"數一數，這一種有幾個？跟著手指，一個一個點",play:async b=>{
      b.appendChild(el("div","need",Z("只數 ")+e));b.appendChild(el("div","tip",Z(TIPC)));
      const w=el("div","cnt");b.appendChild(w);const a=[];mix.forEach(x=>{const t=el("button","it",x);w.appendChild(t);if(x===e)a.push(t)});
      await gcount(a);return pickNum(b,n,1,"一共有幾個？")}}}
  return{kw:"數一數",chunks:["數一數","，","有幾個","？"],done:"數一數，一共有"+n+"個",say:"數一數，有幾個？跟著手指，一個一個點",play:async b=>{
    b.appendChild(el("div","tip",Z(TIPC)));const {a}=mkItems(b,e,n);await gcount(a);return pickNum(b,n,1,"一共有幾個？")}}}
function qCross(){const t=R(2,5),h=t+R(1,3),e=pick(FRUIT);
  return{kw:"畫掉",chunks:["數一數","，","多的","畫掉","。"],done:"多的"+(h-t)+"個畫掉了，剩下"+t+"個",say:"要"+t+"個。先數一數，跟著手指，一個一個點",play:async b=>{

    const tip=el("div","tip",Z(TIPC));b.appendChild(tip);const {a}=mkItems(b,e,h);
    await gcount(a.slice(0,t));tip.innerHTML=Z("多的，點一下畫掉");tell("多的，點一下，畫掉");
    await new Promise(res=>{let left=h-t;a.slice(t).forEach(x=>{x.classList.add("nx");x.onclick=()=>{if(busy()||x.classList.contains("x"))return;x.classList.remove("nx");x.classList.add("x");lock(250);if(--left===0)res()}})});
    return true}}}
function qAdd(){const h=R(1,5),t=h+R(1,4),e=pick(FRUIT);
  return{kw:"補上去",chunks:["數一數","，","不夠的","補上去","。"],done:"補上去"+(t-h)+"個，現在有"+t+"個",say:"要"+t+"個。先數一數，跟著手指，一個一個點",play:async b=>{
    b.appendChild(el("div","need",Z("要 ")+"<b>"+t+"</b>"+Z(" 個")));

    const sl=[];for(let i=h;i<t;i++){const s=el("button","slot","");s.dataset.fill=e;w.appendChild(s);sl.push(s)}
    await gcount(a);tip.innerHTML=Z("不夠的，點一下補上去");tell("不夠的，點一下，補上同樣的東西");await gcount(sl,h,"n");return true}}}
function qMore(kw){let a=R(2,6),c;do{c=R(2,6)}while(c===a);const es=shuf(FRUIT),ns=[a,c];
  const ok=(kw==="比較多")===(a>c)?0:1;
  return{kw,chunks:["哪一邊",kw,"？"],done:kw==="比較多"?Math.max(a,c)+"個比"+Math.min(a,c)+"個多":Math.min(a,c)+"個比"+Math.max(a,c)+"個少",say:"哪一邊"+kw+"？先數一數，跟著手指，一個一個點",play:async b=>{
    const tip=el("div","tip",Z(TIPC));b.appendChild(tip);const rows=[];
    ns.forEach((n,i)=>{const r=el("div","rowb");const its=[];for(let k=0;k<n;k++){const x=el("button","it",es[i]);r.appendChild(x);its.push(x)}
      const num=el("span","num","");r.appendChild(num);b.appendChild(r);rows.push({r,its,num})});
    for(const o of rows){o.num.textContent=await gcount(o.its)}
    tip.innerHTML=Z("點"+kw+"的那一邊");tell("哪一邊"+kw+"？點點看");
    return new Promise(res=>{let first=true,done=false;rows.forEach((o,i)=>{o.r.classList.add("pk");if(i===ok)o.r.dataset.ok=1;
      o.r.onclick=()=>{if(busy()||done)return;if(i===ok){done=true;o.r.classList.add("right");res(first)}else{first=false;o.r.classList.add("wrong");lock(1200);speak("再試試看")}}})})}}}
function qSame(kw,v){const ns=shuf([2,3,4,5,6,7,8,9]).slice(0,3),es=shuf(FRUIT);
  if(kw==="一樣多"&&v===1){const n=R(2,7);let m;do{m=n+pick([-2,-1,1,2])}while(m<1);const o=shuf([n,m]);
    return{kw,chunks:["哪一個","和上面","一樣多","？"],done:"上面"+n+"個，下面也是"+n+"個，一樣多",say:"哪一個和上面一樣多？點點看",play:b=>{
      b.appendChild(el("div","grp",'<div class="g">'+rep('<span class="it">'+es[0]+"</span>",n)+"</div>"));
      return choices(b,o.map(k=>circ(k)),o.indexOf(n),"rows")}}}
  return{kw,chunks:["把","一樣多","的","連起來","。"],done:"一樣多的，都連起來了",say:"把一樣多的連起來。先點上面，再點下面",play:b=>{b.appendChild(el("div","tip",Z("點上面，再點下面，連起來")));
    return connect(b,ns.map((n,i)=>({key:n,html:rep(es[i],n)})),shuf(ns).map(n=>({key:n,html:circ(n)})))}}}
function qSeq(){const up=Math.random()<.5,s=R(1,5),seq=[];for(let i=0;i<6;i++)seq.push(up?s+i:s+5-i);
  const blanks=shuf([0,1,2,3,4,5]).slice(0,3).sort((a,b)=>a-b);
  return{kw:"按照順序",chunks:["按照順序","填填看","。"],done:"按照順序，"+seq.join("，"),say:"按照順序填填看。空格是多少？選數字",play:b=>sequence(b,seq,blanks)}}
function qLen(kw){const big=Math.random()<.5?0:1;const want=/長|高/.test(kw)?big:1-big;let noun,opts,cls;
  if(/長|短/.test(kw)){noun="哪一枝";cls="rows";const L=R(80,96),S=R(35,60);opts=[bar(big===0?L:S),bar(big===1?L:S)]}
  else if(/高/.test(kw)){noun="哪一個";cls="cols";const L=R(85,100),S=R(35,60);opts=[tower(big===0?L:S),tower(big===1?L:S)]}
  else{noun="哪一本";cls="cols";const L=R(55,75),S=R(15,28);opts=[book(big===0?L:S),book(big===1?L:S)]}
  return{kw,chunks:[noun,kw,"？"],done:"這個"+kw,say:noun+kw+"？點點看",play:b=>choices(b,opts,want,cls)}}
function qFace(kw){const o=shuf([{h:pick(BALL),k:"彎彎的面"},{h:pick(BOX),k:"平平的面"}]);
  return{kw,chunks:["哪個東西","有",kw,"？"],done:"這個東西有"+kw,say:"哪個東西有"+kw+"？點點看",play:b=>choices(b,o.map(x=>x.h),o.findIndex(x=>x.k===kw),"big")}}
function qPart(kw){
  const grp=(b,list)=>{const g=el("div","grp");const out=[];list.forEach((x,i)=>{if(i&&x.sep)g.appendChild(el("span","sep",x.sep));const bx=el("div","g");const its=[];
      for(let k=0;k<x.n;k++){const t=el(x.btn?"button":"span","it",x.e);bx.appendChild(t);its.push(t)}g.appendChild(bx);out.push(its)});b.appendChild(g);return out};
  if(kw==="合起來"){const a=R(1,5),c=R(1,Math.min(5,10-a));
    return{kw,chunks:[a+"和"+c,"合起來","是","多少","？"],done:a+"和"+c+"，合起來是"+(a+c),say:a+"和"+c+"，合起來是多少？先數藍色，一個一個點",play:async b=>{
      const tip=el("div","tip",Z("先數藍色"));b.appendChild(tip);
      const [A,B]=grp(b,[{n:a,e:"🔵",btn:1},{n:c,e:"🟠",btn:1,sep:"＋"}]);
      const lab=(its,n)=>its[0].parentNode.appendChild(el("span","gnum",n));
      await gcount(A);lab(A,a);
      tip.innerHTML=Z("再數橘色");tell("再數橘色，一個一個點");await gcount(B);lab(B,c);
      await raw(FAST?1:600);A[0].parentNode.parentNode.classList.add("merged");await raw(FAST?1:1000);A.concat(B).forEach(x=>{x.classList.remove("n");const d=x.querySelector(".bd");if(d)d.remove()});
      tip.innerHTML=Z("藍色和橘色合起來，全部一個一個點");tell("藍色"+a+"個，和橘色"+c+"個，合起來。全部再數一次，一個一個點");
      await gcount(A.concat(B));return pickNum(b,a+c,1,"藍色和橘色，合起來是多少？")}}}
  const t=R(4,9),a=R(1,t-1);
  return{kw,own:true,chunks:[t+"可以","分成",a+"和","多少","？"],done:t+"可以分成"+a+"和"+(t-a),say:"橘色有幾個？請點點看",play:async(b,intro)=>{
    const g0=gen,gone=()=>gen!==g0,hang=()=>new Promise(()=>{});
    const sp=x=>new Promise(r=>{last=x;sayAt=Date.now();skipFn=utter(x,r)});
    const need=el("div","need",Z("全部有 ")+"<b>"+t+"</b>"+Z(" 個"));b.appendChild(need);
    const [A,B]=grp(b,[{n:a,e:"🔵"},{n:t-a,e:"🟠",btn:1,sep:"｜"}]);const G=A[0].parentNode.parentNode;
    G.classList.add("merged");                                   /* 一開始是合在一起的 */
    const tip=el("div","tip","&nbsp;");b.appendChild(tip);
    await sp((intro||"")+t+"可以分成"+a+"和多少？全部有"+t+"個");if(gone())return hang();

    A[0].parentNode.appendChild(el("span","gnum",a));
    await sp("藍色有"+a+"個");if(gone())return hang();
    A.forEach(x=>x.classList.remove("glow"));
    G.classList.remove("merged");need.innerHTML="<b>"+t+"</b>"+Z(" 個，分成藍色和橘色");   /* 分開 */
    await raw(FAST?1:1000);if(gone())return hang();
    tip.innerHTML=Z("藍色有 ")+a+Z(" 個，橘色有幾個？請點點看");tell("分開了。藍色有"+a+"個，橘色有幾個？請點點看");
    await gcount(B);return pickNum(b,t-a,1,"橘色有幾個？")}}}
function qQueue(kw,v){const n=7,st=R(0,ANI.length-n),q=ANI.slice(st,st+n),front=kw==="前面";
  const ord=v===0?true:v===1?false:Math.random()<.5,i=ord?R(1,5):(front?R(2,6):R(0,4)),X=q[i];
  return{kw,done:ord?"從"+kw+"開始數，"+X[1]+"排在第"+(front?i+1:n-i)+"個":"排在"+X[1]+kw+"的，有"+(front?i:n-1-i)+"隻",say:(ord?"從"+kw+"開始數，"+X[1]+"排在第幾個？":"排在"+X[1]+kw+"的，有幾隻？")+"跟著手指，一個一個點",chunks:ord?["從",kw,"開始數","，",X[0]+"排在","第幾個","？"]:["排在"+X[0],kw,"的","有幾隻","？"],play:async b=>{
    b.appendChild(el("div","tip",Z(TIPC)));
    const row=el("div","queue",'<span class="tag">前</span>');const bs=q.map((a,k)=>{const x=el("button","an"+(k===i?" t":""),a[0]);row.appendChild(x);return x});
    row.appendChild(el("span","tag","後"));b.appendChild(row);

const LV=[
 {name:"數一數",ks:[{kw:"數一數",tr:[0,1,2]}],gen:qCount,per:3},
 {name:"多的畫掉",ks:[{kw:"畫掉",tr:[0,1]}],gen:qCross,per:3},
 {name:"不夠的補上去",ks:[{kw:"補上去",tr:[0,1,2]}],gen:qAdd,per:3},
 {name:"比較多、比較少",ks:[{kw:"比較多",tr:[0,1,2]},{kw:"比較少",tr:[2]}],gen:qMore,per:2},
 {name:"一樣多、連起來",ks:[{kw:"一樣多",tr:[1,2]},{kw:"連起來",tr:[0,1,2]}],gen:qSame,per:2},
 {name:"按照順序",ks:[{kw:"按照順序",tr:[0,1,2,3]}],gen:qSeq,per:3},
 {name:"比長短",ks:[{kw:"比較長",tr:[2]},{kw:"比較短",tr:[2]},{kw:"比較高",tr:[2]},{kw:"比較薄",tr:[2]}],gen:qLen,per:2},
 {name:"彎彎的面、平平的面",ks:[{kw:"彎彎的面",tr:[0,3]},{kw:"平平的面",tr:[0]}],gen:qFace,per:2},
 {name:"合起來、分成",ks:[{kw:"合起來",tr:[0]},{kw:"分成",tr:[0,1]}],gen:qPart,per:2},
 {name:"前面、後面",ks:[{kw:"前面",tr:[0]},{kw:"後面",tr:[0]}],gen:qQueue,per:2}];

/* 每個關鍵字只做一題，不重複 */
LV.forEach(L=>{L.per=1});
/* 同一關裡，每個字只描一次 */
LV.forEach(L=>{const seen=new Set();L.ks.forEach(K=>{K.tr=[];[...K.kw].forEach((c,i)=>{if(!seen.has(c)){seen.add(c);K.tr.push(i)}})})});

/* ---------- 流程 ---------- */
const isP=c=>/^[，。？、：｜]+$/.test(c);
async function runQ(q,g,intro){
  stage.innerHTML="";
  stage.appendChild(el("div","sent",q.chunks.map(c=>c===q.kw?'<span class="hl">'+Z(c)+"</span>":"<span>"+Z(c)+"</span>").join("")));
  const box=el("div","play");stage.appendChild(box);
  if(!q.own){tell((intro||"")+q.say);last=q.say}
  const first=await q.play(box,intro);chk(g);window.onresize=null;
  if(first){save.stars++;store();showStars()}
  chime();last="";await say((first?"答對了，得到一顆星星！":"對了！")+(q.done||""),g);await sleep(400,g)}

async function runLevel(i,g){const L=LV[i];let n=0;const tot=L.ks.length*2;
  const ask=async(K,v,intro)=>{n++;$("prog").textContent="第 "+(i+1)+" 關："+L.name+"　第 "+n+" 題／共 "+tot+" 題";await runQ(L.gen(K.kw,v),g,intro)};
  for(const K of L.ks){
    await ask(K,0,K.kw+"，就是，"+MEAN[K.kw]+"。");
    if(opt("wheel")){$("prog").textContent="第 "+(i+1)+" 關："+L.name;await wheelGame(K,g)}
    await ask(K,1,"");
    if(opt("claw")){$("prog").textContent="第 "+(i+1)+" 關："+L.name;await clawGame(K,g)}}
  save.lv=Math.max(save.lv,i+1);save.cur=(i+1)%LV.length;store();
  stage.innerHTML="";stage.appendChild(el("div","yay",Z("過關了！")));
  stage.appendChild(el("div","mean",Z("你有 ")+save.stars+Z(" 顆星星")));chime();await say("過關了，你好棒！你有"+save.stars+"顆星星",g);await sleep(600,g)}
async function playFrom(i,g){for(;i<LV.length;i++){await runLevel(i,g);
    if(opt("one")&&i<LV.length-1){await say("今天玩到這裡。下次再玩下一關",g);home();return}}
  stage.innerHTML="";stage.appendChild(el("div","yay",Z("全部過關了！")));await say("全部過關了，你好棒！",g);await sleep(1200,g);home()}
async function traceMode(i,g){const L=LV[i];$("prog").textContent="描描看　第 "+(i+1)+" 關："+L.name;

  stage.innerHTML="";stage.appendChild(el("div","yay",Z("描好了！")));chime();await say("這一關的字都描好了，你好棒！",g);await sleep(800,g);home()}
async function daily(g){const N=8;let prev=-1;

  stage.innerHTML="";stage.appendChild(el("div","yay",Z("練習好了！")));stage.appendChild(el("div","mean",Z("你有 ")+save.stars+Z(" 顆星星")));
  await say("練習好了，你好棒！你有"+save.stars+"顆星星",g);await sleep(1000,g);home()}
function start(fn){gen++;const g=gen;window.onresize=null;fn(g).catch(e=>{if(e!=="abort")console.error(e)})}

  const b3=el("button","bigbtn b3","描描看（第 "+(tc+1)+" 關的字）");b3.id="trace";b3.onclick=()=>start(g=>traceMode(tc,g));h.appendChild(b3);

  const sg=el("div","setg");[["wheel","摩天輪拼字","要玩","不玩"],["claw","夾注音","要玩","不玩"],["hint","注音提示","有","沒有"],["one","一次玩","一關","全部"]].forEach(([k,n,a,b])=>{
    const x=el("button","");const show=()=>{x.textContent=n+"："+(opt(k)?a:b);x.className=opt(k)?"":"off"};show();x.dataset.k=k;

  h.appendChild(el("div","sub","老師選關"));
  const gr=el("div","lvg");LV.forEach((L,i)=>{const b=el("button",i<save.lv?"ok":"",(i+1)+"　"+L.name);b.onclick=()=>start(g=>playFrom(i,g));gr.appendChild(b)});
  h.appendChild(gr);stage.appendChild(h)}

$("bHome").onclick=()=>{paused=false;$("pause").classList.remove("on");home()};

showStars();showSpd();home();
