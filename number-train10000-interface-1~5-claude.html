<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>10,000以內的數字互動遊戲(間隔1~5．由簡入難)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #fdfbf7, #e0f2fe);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; touch-action: manipulation;
        }

        .main-wrapper {
            width: 100%; max-width: 580px; height: 100%; max-height: 100dvh;
            background: #ffffff; border: 4px solid #38bdf8; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            gap: 6px; position: relative; overflow-y: auto;
        }

        #home-screen { text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 4px; }
        h1 { font-size: 20px; color: #1e293b; margin: 4px 0; }
        .subtitle { color: #0284c7; font-size: 12px; font-weight: bold; margin: 0 0 8px 0; }

        .intro-card {
            background: #f0f9ff; border: 2px solid #bae6fd; border-radius: 12px;
            padding: 8px 14px; margin-bottom: 10px; width: 100%; box-sizing: border-box; text-align: left;
        }
        .intro-card h3 { margin: 0 0 4px 0; font-size: 13px; color: #0369a1; }
        .intro-card ul { margin: 0; padding-left: 18px; font-size: 12px; color: #334155; line-height: 1.5; }
        .intro-card li { margin-bottom: 3px; }

        .start-btn { padding: 12px 30px; font-size: 22px; font-weight: bold; background-color: #0ea5e9; color: white; border-radius: 16px; cursor: pointer; box-shadow: 0px 4px 10px rgba(0,0,0,0.2); border: none; width: 100%; max-width: 260px; }
        .start-btn:active { transform: scale(0.95); background-color: #0284c7; }

        #game-ui { text-align: center; width: 100%; display: none; flex-direction: column; align-items: center; flex: 1 1 auto; min-height: 0; }

        #status-bar {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            font-size: 13px; font-weight: bold; color: #1e293b; border-bottom: 2px solid #e0f2fe;
            padding-bottom: 4px; margin-bottom: 4px; flex-wrap: wrap; row-gap: 4px; flex-shrink: 0;
        }
        .status-left { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }

        .btn-group { display: flex; gap: 4px; flex-wrap: wrap; row-gap: 4px; }
        .control-btn {
            padding: 5px 9px; font-size: 12px; background: #0ea5e9; color: white; border: none;
            border-radius: 8px; cursor: pointer; font-weight: bold; touch-action: manipulation;
        }
        .control-btn:active { background: #0284c7; transform: scale(0.95); }
        .hint-btn-el { background: #16a34a; }
        .pause-btn-el { background: #f59e0b; }
        .switch-btn-el { background: #64748b; }

        .speed-row { display: flex; gap: 4px; width: 100%; justify-content: center; margin-bottom: 4px; flex-shrink: 0; }
        .speed-btn {
            flex: 1; max-width: 100px; background: #f0f9ff; color: #0369a1; border: 2px solid #bae6fd;
            border-radius: 8px; padding: 4px 4px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .speed-btn.active { background: #0ea5e9; color: #fff; border-color: #0284c7; }
        .speed-btn:active { transform: scale(0.95); }

        #visual-area {
            min-height: 110px; max-height: 130px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5vw;
            flex-wrap: wrap;
            background: linear-gradient(to bottom, #e0f2fe 65%, #86efac 65%, #86efac 72%, #f8fafc 72%);
            border-radius: 12px; border: 2px dashed #90caf9; padding: 4px; flex-shrink: 0; overflow: visible;
        }
        .train-car-wrapper { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .train-car {
            font-size: 34px; line-height: 34px; height: 38px; width: 40px;
            display: flex; align-items: center; justify-content: center;
        }
        .train-car-num {
            font-size: 15px; font-weight: bold; color: #1e293b;
            background: #ffffff; border: 2px solid #90caf9; border-radius: 6px;
            padding: 1px 6px; min-width: 42px; text-align: center;
        }
        .train-car-num.blank-num { background: #fef08a; border-color: #ca8a04; color: #92400e; }

        #equation { font-size: 20px; font-weight: bold; color: #1e293b; margin: 4px 0; flex-shrink: 0; }
        #feedback { font-size: 14px; color: #d84315; font-weight: bold; min-height: 20px; margin: 2px 0; flex-shrink: 0; }

        #drop-game-container {
            position: relative; width: 100%; height: 150px; min-height: 150px; flex-grow: 1; max-height: 250px;
            background: linear-gradient(180deg, #dbeeff, #f1f5f9);
            border: 3px solid #7dd3fc; border-radius: 14px;
            overflow: hidden; touch-action: manipulation;
        }

        /* 籃球造型：立體漸層＋正統十字接縫線，數字放在中間白色圓形底牌上 */
        .falling-option {
            position: absolute; width: 64px; height: 64px; border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, #ffc27a, #f0810a 50%, #b34f00 85%, #8a3d00 100%);
            border: 2px solid #6b3600;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.35), inset -6px -6px 10px rgba(0,0,0,0.25), inset 4px 4px 8px rgba(255,255,255,0.3);
            animation: floatUp linear forwards;
            z-index: 999; pointer-events: auto; overflow: hidden;
        }
        .falling-option::before {
            content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 100%;
            background: rgba(50,25,0,0.6); transform: translateX(-50%); z-index: 1;
        }
        .falling-option::after {
            content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 2px;
            background: rgba(50,25,0,0.6); transform: translateY(-50%); z-index: 1;
        }
        .ball-badge {
            position: relative; z-index: 2;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.95);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.35);
        }
        .ball-num { font-size: 14px; font-weight: bold; color: #8a3d00; }
        .falling-option:active { transform: scale(0.92); }
        .falling-option.hint-glow {
            box-shadow: 0 0 0 4px #fde047, 0 4px 10px rgba(0,0,0,0.35);
            animation: floatUp linear forwards, glowPulse 1s ease-in-out infinite;
        }
        .falling-option.popping { animation: popEffect 0.32s ease-out forwards !important; pointer-events: none; }
        @keyframes glowPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }
        @keyframes popEffect {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            35% { transform: scale(1.35) rotate(-4deg); opacity: 1; }
            100% { transform: scale(0.15) rotate(6deg); opacity: 0; }
        }
        @keyframes floatUp {
            0%   { top: 100%; transform: translateX(0); }
            25%  { transform: translateX(8px); }
            50%  { transform: translateX(-6px); }
            75%  { transform: translateX(6px); }
            100% { top: -85px; transform: translateX(-4px); }
        }

        #completeOverlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.96); border-radius: 18px; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px; z-index: 5000; text-align: center; padding: 16px;
        }
        #completeOverlay .equation-big {
            font-family: monospace; font-size: 19px; font-weight: bold; color: #15803d;
            background: #f0fdf4; border: 3px solid #86efac; border-radius: 10px; padding: 10px 14px;
            max-width: 90%; word-break: break-word; text-align: center; line-height: 1.4;
        }
        #completeOverlay .interval-text { font-size: 14px; font-weight: bold; color: #0369a1; }
        #completeOverlay .cheer { font-size: 16px; font-weight: bold; color: #166534; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="home-screen">
        <h1>🚂 10,000以內的數字互動遊戲</h1>
        <p class="subtitle">🏀 間隔 1~5，由簡入難，全方位練習！</p>

        <div class="intro-card">
            <h3>📖 遊戲怎麼玩：</h3>
            <ul>
                <li>觀察火車車廂，找出被問號擋住的正確數字。</li>
                <li>畫面下方會飄上來一顆顆籃球，上面有數字。</li>
                <li>點對答案的籃球就能過關！</li>
                <li>卡住了嗎？按「💡提示」會給你線索！</li>
                <li>題目會先從簡單的間隔 1 開始，慢慢加深到間隔 5 喔！</li>
            </ul>
        </div>

        <button class="start-btn" id="startBtn" onclick="startGame()">🎮 開始遊戲</button>
    </div>

    <div id="game-ui">
        <div id="status-bar">
            <div class="status-left">
                <span id="score">闖關: 0</span>
            </div>
            <div class="btn-group">
                <button class="control-btn hint-btn-el" onclick="useHint()">💡提示</button>
                <button class="control-btn pause-btn-el" id="pauseBtn" onclick="togglePause()">暫停</button>
                <button class="control-btn switch-btn-el" onclick="restartGame()">🔄重新開始</button>
            </div>
        </div>

        <div class="speed-row">
            <button class="speed-btn" id="speedSlow" onclick="setSpeed('slow')">🐢慢</button>
            <button class="speed-btn active" id="speedNormal" onclick="setSpeed('normal')">🚶正常</button>
            <button class="speed-btn" id="speedFast" onclick="setSpeed('fast')">🐇快</button>
        </div>

        <div id="visual-area"></div>
        <div id="equation">? , ? , ? , ?</div>
        <div id="feedback">請觀察火車變化...</div>

        <div id="drop-game-container"></div>

        <div id="completeOverlay">
            <div class="equation-big" id="completeEquation">3456 , 3457 , 3458 , 3459</div>
            <div class="interval-text" id="completeIntervalText">每次間隔 1</div>
            <div class="cheer">🌟 太棒了，過關了！</div>
        </div>
    </div>
</div>

<script>
    const MIN_NUM = 1000;
    const MAX_NUM = 9999;

    let questionCount = 0;
    let currentStep = 1;

    // 難度同時考慮「間隔大小」跟「方向與空格位置」兩個維度，由簡入難依序組合：
    // 先間隔1（最簡單）、再2、再3、再4、最後間隔5；每個間隔內也是先固定遞增、
    // 再固定遞減、再方向不定，最後空格任意位置最難，每個階段安排4題。
    const DIFFICULTY_TIERS = [];
    for (let step = 1; step <= 5; step++) {
        DIFFICULTY_TIERS.push({ step, forceDir: 'asc',  blankMode: 'last' });
        DIFFICULTY_TIERS.push({ step, forceDir: 'desc', blankMode: 'last' });
        DIFFICULTY_TIERS.push({ step, forceDir: null,   blankMode: 'last' });
        DIFFICULTY_TIERS.push({ step, forceDir: null,   blankMode: 'any'  });
    }
    const QUESTIONS_PER_TIER = 4;
    function getDifficultyForQuestion() {
        const tierIndex = Math.min(Math.floor(questionCount / QUESTIONS_PER_TIER), DIFFICULTY_TIERS.length - 1);
        return DIFFICULTY_TIERS[tierIndex];
    }

    let gameStarted = false;
    let score = 0;
    let audioCtx = null;
    let isPaused = false;
    let isAnswered = false;
    let pendingNextQuestion = false;
    let nextQuestionTimeout = null;
    let gameInterval = null;
    let activeOptions = [];
    let hintLevel = 0;
    let hintActiveValue = null;
    let speedMode = 'normal';
    let trainSequence = [];
    let currentAns = 0;
    let currentOptionsArr = [];

    const SPEED_SETTINGS = {
        slow:   { fallDuration: 8,   spawnInterval: 2600 },
        normal: { fallDuration: 5.5, spawnInterval: 2000 },
        fast:   { fallDuration: 3.5, spawnInterval: 1300 }
    };

    function speak(text, onEnd) {
        if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
        try {
            window.speechSynthesis.cancel();
            let finished = false;
            const trigger = () => { if (finished) return; finished = true; if (onEnd) onEnd(); };
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-TW';
            msg.onend = trigger;
            msg.onerror = trigger;
            window.speechSynthesis.speak(msg);
            setTimeout(trigger, Math.max(1500, text.length * 300 / 0.85));
        } catch (e) { if (onEnd) onEnd(); }
    }

    function boom() { try { confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } }); } catch (e) {} }

    function playPopSound() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(700, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.11);
            gain.gain.setValueAtTime(0.38, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.14);
        } catch (e) {}
    }

    function restartGame() {
        isPaused = false;
        pendingNextQuestion = false;
        gameStarted = false;
        questionCount = 0;
        if (gameInterval) clearInterval(gameInterval);
        if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
        activeOptions.forEach(el => el.remove());
        activeOptions = [];
        hideCompletionScreen();
        try { window.speechSynthesis.cancel(); } catch (e) {}
        document.getElementById('game-ui').style.display = 'none';
        document.getElementById('home-screen').style.display = 'flex';
    }

    function startGame() {
        if (document.getElementById('home-screen').style.display === 'none') return;
        gameStarted = true;
        questionCount = 0;

        if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        try { window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch (e) {}

        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('game-ui').style.display = 'flex';
        score = 0;
        document.getElementById('score').innerText = `闖關: ${score}`;
        const pauseBtn = document.getElementById('pauseBtn');
        pauseBtn.innerText = "暫停"; pauseBtn.style.backgroundColor = "#f59e0b";
        loadQuestion();
    }

    function setSpeed(mode) {
        speedMode = mode;
        ['slow', 'normal', 'fast'].forEach(m => {
            document.getElementById('speed' + m.charAt(0).toUpperCase() + m.slice(1)).classList.toggle('active', m === mode);
        });
        if (!isPaused && !isAnswered && gameStarted) startFallingLoop();
    }

    function togglePause() {
        if (!gameStarted) return;
        isPaused = !isPaused;
        const pauseBtn = document.getElementById('pauseBtn');
        const options = document.querySelectorAll('.falling-option');

        if (isPaused) {
            pauseBtn.innerText = "繼續";
            pauseBtn.style.backgroundColor = "#16a34a";
            if (gameInterval) clearInterval(gameInterval);
            if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
            try { window.speechSynthesis.cancel(); } catch (e) {}
            options.forEach(el => el.style.animationPlayState = 'paused');
        } else {
            pauseBtn.innerText = "暫停";
            pauseBtn.style.backgroundColor = "#f59e0b";
            options.forEach(el => el.style.animationPlayState = 'running');
            if (pendingNextQuestion) {
                pendingNextQuestion = false;
                hideCompletionScreen();
                loadQuestion();
            } else if (!isAnswered) {
                startFallingLoop();
            }
        }
    }

    function loadQuestion() {
        if (!gameStarted) return;
        isAnswered = false;
        hintLevel = 0;
        hintActiveValue = null;
        hideCompletionScreen();

        const tier = getDifficultyForQuestion();
        questionCount++;
        currentStep = tier.step;
        const STEP = tier.step;

        let isAscending = tier.forceDir === 'asc' ? true
            : tier.forceDir === 'desc' ? false
            : Math.random() < 0.5;

        const baseMax = isAscending ? MAX_NUM - 3 * STEP : MAX_NUM;
        const baseMin = isAscending ? MIN_NUM : MIN_NUM + 3 * STEP;
        const baseNum = baseMin + Math.floor(Math.random() * (baseMax - baseMin + 1));
        const actualStep = isAscending ? STEP : -STEP;

        trainSequence = [];
        for (let i = 0; i < 4; i++) trainSequence.push(baseNum + i * actualStep);

        const blankIndex = tier.blankMode === 'last' ? 3
            : Math.floor(Math.random() * 4);
        currentAns = trainSequence[blankIndex];

        renderTrain(trainSequence, blankIndex);

        document.getElementById('feedback').innerText = "看看火車車廂，空格的數字是多少呢？";
        speak(`看看火車車廂，空格的數字是多少呢？`);

        let options = new Set([currentAns]);
        let attempts = 0;
        while (options.size < 4 && attempts < 100) {
            attempts++;
            const r = MIN_NUM + Math.floor(Math.random() * (MAX_NUM - MIN_NUM + 1));
            if (!trainSequence.includes(r)) options.add(r);
        }
        currentOptionsArr = Array.from(options).sort(() => Math.random() - 0.5);

        startFallingLoop();
    }

    function renderTrain(seq, blankIdx) {
        let area = document.getElementById('visual-area');
        area.innerHTML = '';
        seq.forEach((num, idx) => {
            let wrapper = document.createElement('div');
            wrapper.className = 'train-car-wrapper';

            let t = document.createElement('div');
            t.className = 'train-car';
            t.innerText = '🚃';

            let numLabel = document.createElement('div');
            numLabel.className = 'train-car-num';
            if (idx === blankIdx) numLabel.classList.add('blank-num');
            numLabel.innerText = idx === blankIdx ? '?' : num;

            wrapper.appendChild(t);
            wrapper.appendChild(numLabel);
            area.appendChild(wrapper);
        });
        renderEquationLine(seq, blankIdx);
    }

    function renderEquationLine(seq, blankIdx) {
        const parts = seq.map((num, idx) => idx === blankIdx ? '?' : num);
        document.getElementById('equation').innerText = parts.join(' , ');
    }

    function startFallingLoop() {
        if (!gameStarted) return;
        if (gameInterval) clearInterval(gameInterval);
        let index = 0;
        gameInterval = setInterval(() => {
            if (isPaused) return;
            if (isAnswered) { clearInterval(gameInterval); return; }
            if (currentOptionsArr.length === 0) return;
            if (index >= currentOptionsArr.length) index = 0;
            spawnFallingOption(currentOptionsArr[index]);
            index++;
        }, SPEED_SETTINGS[speedMode].spawnInterval);
    }

    function useHint() {
        if (isPaused || isAnswered || !gameStarted) return;
        hintLevel++;
        let blankIndex = trainSequence.indexOf(currentAns);
        let isAscending = trainSequence.length > 1 && trainSequence[1] > trainSequence[0];

        if (hintLevel === 1) {
            let neighborVal, direction;
            if (blankIndex > 0) {
                neighborVal = trainSequence[blankIndex - 1];
                direction = isAscending ? `多 ${currentStep}` : `少 ${currentStep}`;
            } else {
                neighborVal = trainSequence[blankIndex + 1];
                direction = isAscending ? `少 ${currentStep}` : `多 ${currentStep}`;
            }
            const text = `🔍 提示：旁邊車廂是 ${neighborVal}，這一格要比它${direction}喔！`;
            document.getElementById('feedback').innerText = text;
            speak(text.replace('🔍 提示：', ''));
        } else {
            const text = `💡 答案是 ${currentAns}，找找看畫面上這個數字的籃球！`;
            document.getElementById('feedback').innerText = text;
            speak(text.replace('💡 ', ''));
            hintActiveValue = currentAns;
            activeOptions.forEach(opt => { if (opt.dataset.val === String(currentAns)) opt.classList.add('hint-glow'); });
        }
    }

    function showCompletionScreen() {
        document.getElementById('completeEquation').innerText = trainSequence.join(' , ');
        document.getElementById('completeIntervalText').innerText = `每次間隔 ${currentStep}`;
        document.getElementById('completeOverlay').style.display = 'flex';
    }
    function hideCompletionScreen() {
        document.getElementById('completeOverlay').style.display = 'none';
    }

    function spawnFallingOption(val) {
        if (isAnswered || isPaused) return;
        const container = document.getElementById('drop-game-container');
        const el = document.createElement('div');
        el.className = 'falling-option';
        el.dataset.val = String(val);
        if (hintActiveValue !== null && val === hintActiveValue) el.classList.add('hint-glow');
        el.innerHTML = `<div class="ball-badge"><span class="ball-num">${val}</span></div>`;

        const randomX = Math.random() * (container.clientWidth - 64);
        el.style.left = randomX + 'px';
        el.style.animationDuration = SPEED_SETTINGS[speedMode].fallDuration + 's';
        if (isPaused) el.style.animationPlayState = 'paused';

        let isHandled = false;
        const handleSelect = (e) => {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            if (isAnswered || isHandled || isPaused) return;

            if (val === currentAns) {
                isAnswered = true;
                isHandled = true;
                if (gameInterval) clearInterval(gameInterval);

                playPopSound();
                el.classList.add('popping');
                setTimeout(() => el.remove(), 320);
                activeOptions.forEach(opt => { if (opt !== el) opt.remove(); });
                activeOptions = [];

                score++;
                document.getElementById('score').innerText = `闖關: ${score}`;
                document.getElementById('feedback').innerText = "🎉 太棒了！火車順利開走了！";
                renderEquationLine(trainSequence, -1);
                setTimeout(() => boom(), 150);
                showCompletionScreen();

                pendingNextQuestion = true;
                const goNext = () => {
                    if (!pendingNextQuestion) return;
                    if (isPaused) return;
                    if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
                    pendingNextQuestion = false;
                    loadQuestion();
                };
                speak(`答對了，就是 ${currentAns}！`, () => {
                    if (!pendingNextQuestion) return;
                    if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
                    nextQuestionTimeout = setTimeout(goNext, 1000);
                });
                if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
                nextQuestionTimeout = setTimeout(goNext, 6000);

            } else {
                isHandled = true;
                speak("再算算看喔！");
                document.getElementById('feedback').innerText = "❌ 再試一次！";
                el.style.transition = "opacity 0.3s";
                el.style.opacity = "0";
                setTimeout(() => el.remove(), 300);
            }
        };

        el.addEventListener('pointerdown', handleSelect);
        el.addEventListener('animationend', () => {
            el.remove();
            activeOptions = activeOptions.filter(item => item !== el);
        });

        container.appendChild(el);
        activeOptions.push(el);
    }
</script>
</body>
</html>
