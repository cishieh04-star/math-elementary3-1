<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>10,000以內的數字接力遊戲(綜合挑戰．由簡入難)</title>
    <!-- 引入灑花特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        } 

        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fdfbf7, #e0f2fe); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            touch-action: manipulation;
        }

        .main-wrapper {
            width: 100%;
            max-width: 580px;
            height: 100%;
            max-height: 100dvh;
            background: #ffffff;
            border-radius: 0;
            border: none;
            padding: 8px 10px;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        @media (min-width: 520px) {
            .main-wrapper {
                border-radius: 20px;
                border: 4px solid #cbd5e1;
                max-height: 96vh;
                height: auto;
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
                margin: auto;
            }
        }

        #home-screen { 
            text-align: center; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            align-items: center; 
            height: 100%;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
            padding: 12px;
        }
        #home-screen h1 { font-size: 20px; color: #15803d; margin: 4px 0 6px 0; }
        #home-screen .subtitle { color: #0284c7; font-size: 13px; font-weight: bold; margin: 0 0 10px 0; }

        .intro-card {
            background: #f0fdf4; border: 2px solid #bbf7d0; border-radius: 12px;
            padding: 10px 12px; margin-bottom: 12px; width: 100%; text-align: left;
        }
        .intro-card p { margin: 0 0 4px 0; font-size: 13px; font-weight: bold; color: #15803d; }
        .intro-card ul { margin: 0; padding-left: 18px; font-size: 12px; color: #166534; line-height: 1.5; }
        .intro-card li { margin-bottom: 2px; }
        .intro-card code { background: #dcfce7; padding: 1px 4px; border-radius: 4px; }

        .level-pick-title { font-size: 14px; font-weight: bold; color: #15803d; margin: 4px 0 8px 0; }
        .level-btn {
            width: 100%; text-align: left; background: #fff; border: 2px solid #86efac;
            border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; cursor: pointer;
            display: flex; flex-direction: column; gap: 2px;
        }
        .level-btn:active { transform: scale(0.98); background: #f0fdf4; }
        .level-btn .lv-name { font-size: 15px; font-weight: bold; color: #15803d; }
        .level-btn .lv-desc { font-size: 12px; color: #47654f; }

        #game-ui { 
            text-align: center; 
            width: 100%; 
            height: 100%;
            display: none; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        #status-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            width: 100%; 
            font-size: 14px; 
            font-weight: bold; 
            color: #2c3e50; 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 4px; 
            flex-shrink: 0;
            flex-wrap: wrap;
            row-gap: 4px;
        }

        .status-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            line-height: 1.3;
        }
        .status-left .level-label { color: #15803d; font-size: 13px; }

        .status-right {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            row-gap: 4px;
        }

        /* 速度調整群組樣式 (+/-) */
        .speed-control-group {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 13px;
        }
        .speed-btn {
            background: #3b82f6;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .speed-btn:active { background: #1d4ed8; transform: scale(0.92); }

        /* 聽題目 / 提示 / 換關卡按鈕樣式 */
        #repeat-audio-btn, #hint-btn, #switch-level-btn {
            color: white;
            border: none;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #repeat-audio-btn {
            background: #0ea5e9;
            box-shadow: 0 2px 5px rgba(14,165,233,0.3);
        }
        #repeat-audio-btn:active { background: #0284c7; transform: scale(0.95); }

        #hint-btn {
            background: #f59e0b;
            box-shadow: 0 2px 5px rgba(245,158,11,0.3);
        }
        #hint-btn:active { background: #d97706; transform: scale(0.95); }

        #switch-level-btn {
            background: #64748b;
        }
        #switch-level-btn:active { background: #475569; transform: scale(0.95); }
        
        /* 視覺提示區：火車車廂軌道區 */
        #visual-area { 
            height: 110px; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            background: linear-gradient(to bottom, #e0f2fe 70%, #94a3b8 70%, #94a3b8 76%, #f8fafc 76%);
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
            padding: 4px;
            position: relative;
            flex-shrink: 0;
        }

        /* 車廂造型設計 */
        .train-carriage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .train-box { 
            width: 68px; 
            height: 60px; 
            background: #3b82f6; 
            border: 3px solid #1e40af;
            border-radius: 10px 10px 5px 5px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            z-index: 2;
        }

        /* 車廂上的窗戶 */
        .train-window {
            width: 56px;
            height: 22px;
            background: #e0f2fe;
            border: 2px solid #1e40af;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px; 
            font-weight: bold;
            color: #1e293b;
        }

        /* 車輪 */
        .train-wheels {
            display: flex;
            gap: 22px;
            margin-top: -3px;
            z-index: 3;
        }
        .wheel {
            width: 12px;
            height: 12px;
            background: #334155;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
        }

        /* 車廂之間的連接器勾環 */
        .train-connector {
            width: 10px;
            height: 5px;
            background: #475569;
            margin-bottom: 22px;
        }

        /* 挖空目標車廂樣式 */
        .train-box.target {
            background: #eab308;
            border-color: #854d0e;
        }
        .train-box.target .train-window {
            background: #fef08a;
            border-color: #854d0e;
            color: #b45309;
        }
        /* 提示用：標示出正在變化的那一位數字，幫助孩子看出規律藏在哪裡 */
        .digit-highlight {
            background: #fde047; color: #92400e; border-radius: 3px;
            padding: 0 1px; animation: digitPulse 0.9s ease-in-out infinite;
        }
        @keyframes digitPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        
        #question { font-size: 18px; font-weight: bold; color: #1e293b; margin: 2px 0; flex-shrink: 0; }
        #feedback { font-size: 16px; color: #e67e22; font-weight: bold; min-height: 22px; margin: 2px 0; flex-shrink: 0; }
        
        /* 掉落答案遊戲區域 */
        #drop-game-container {
            position: relative;
            width: 100%;
            height: 110px;
            background: #f1f5f9;
            border: 3px solid #cbd5e1;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* 掉落的數字球選項 */
        .falling-option {
            position: absolute;
            width: 64px;
            height: 64px;
            background: radial-gradient(circle, #38bdf8 60%, #0284c7 100%);
            border: 3px solid #0369a1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px; 
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            animation: fall linear forwards;
            z-index: 999;
            pointer-events: auto;
        }
        .falling-option:active { transform: scale(0.9); }
        .falling-option.hint-glow {
            box-shadow: 0 0 0 4px #fde047, 0 4px 10px rgba(0,0,0,0.35);
            animation: fall linear forwards, glowPulse 1s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.4); }
        }

        @keyframes fall {
            0% { top: -64px; }
            100% { top: 55px; }
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        button.start-btn, button#start-btn, .control-btn { 
            padding: 12px 35px; 
            font-size: 18px; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(59,130,246,0.3);
            font-weight: bold;
            touch-action: manipulation;
            z-index: 10;
        }
        button.start-btn:active, button#start-btn:active, .control-btn:active { background: #2563eb; transform: scale(0.95); }
        
        #pause-btn {
            background: #d97706;
        }

        #completeOverlay {
            display: none;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.97); border-radius: 12px;
            flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; z-index: 5000; text-align: center; padding: 16px;
        }
        #completeOverlay .equation {
            font-family: monospace; font-size: 19px; font-weight: bold; color: #15803d;
            background: #f0fdf4; border: 3px solid #86efac; border-radius: 10px; padding: 10px 14px;
            max-width: 90%; word-break: break-word; text-align: center; line-height: 1.4;
        }
        #completeOverlay .cheer { font-size: 16px; font-weight: bold; color: #166534; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="home-screen">
        <h1>🚂 10,000以內的數字接力遊戲(綜合挑戰)</h1>
        <p class="subtitle">🌟 由十位到千位，由簡入難，全方位練習！</p>
        
        <div class="intro-card">
            <p>📖 操作使用說明：</p>
            <ul>
                <li><strong>觀察數字的變化：</strong>注意上方車廂數字，掌握變化的規律。</li>
                <li><strong>調整方塊掉落速度：</strong>隨時點擊 <code>+</code> 或 <code>-</code> 調整速度！</li>
                <li><strong>點擊數字球通關：</strong>當畫面上方掉落正確答案時，點擊即可完成闖關！</li>
                <li><strong>隨時聽題目：</strong>右上角「🔊 聽題目」按鈕，點擊即可重新朗讀！</li>
                <li><strong>卡住了嗎：</strong>按「💡 提示」會給你線索！</li>
                <li>題目會先從十位的小間隔開始，慢慢加深到百位、千位喔！</li>
            </ul>
        </div>

        <button class="start-btn" id="startBtn" onclick="startGame()">🎮 開始遊戲</button>
    </div>

    <div id="game-ui">
        <div id="status-bar">
            <div class="status-left">
                <span id="score">闖關: 0</span>
            </div>
            <div class="status-right">
                <div class="speed-control-group">
                    <span>速度</span>
                    <button class="speed-btn" onclick="adjustSpeed(-1)" title="減慢速度">-</button>
                    <span id="speed-display" style="min-width: 32px; text-align: center; font-weight: bold; color: #1e293b;">正常</span>
                    <button class="speed-btn" onclick="adjustSpeed(1)" title="加快速度">+</button>
                </div>
                <button id="hint-btn" onclick="useHint()">💡提示</button>
                <button id="repeat-audio-btn" onclick="repeatCurrentQuestion()">🔊聽題目</button>
                <button id="switch-level-btn" onclick="restartGame()">🔄重新開始</button>
            </div>
        </div>
        
        <div id="visual-area"></div>
        <div id="question">火車空格是多少呢？</div>
        <div id="feedback">注意看！數字掉下來囉！</div>
        
        <div id="drop-game-container"></div>

        <div class="btn-group">
            <button id="pause-btn" class="control-btn" onclick="togglePause()">暫停遊戲</button>
        </div>

        <div id="completeOverlay">
            <div class="equation" id="completeEquation">4213</div>
            <div class="cheer">🌟 太棒了，答對了！</div>
        </div>
    </div>
</div>

    <script>
        // 難度同時考慮「間隔大小/變化的位數」跟「方向與空格位置」兩個維度，
        // 由簡入難依序組合：先十位(間隔10→20)、再百位(間隔100→200)、最後千位(間隔1000)，
        // 每個間隔內，也是先固定遞增、再固定遞減、再方向不定，最後空格任意位置最難。
        // 針對一般小朋友設計，每個階段安排4題。
        const DIFFICULTY_TIERS = [
            { step: 10,   placeValue: 10,   placeName: '十位', forceDir: 'asc',  blankMode: 'last' },
            { step: 10,   placeValue: 10,   placeName: '十位', forceDir: 'desc', blankMode: 'last' },
            { step: 10,   placeValue: 10,   placeName: '十位', forceDir: null,   blankMode: 'last' },
            { step: 10,   placeValue: 10,   placeName: '十位', forceDir: null,   blankMode: 'any'  },
            { step: 20,   placeValue: 10,   placeName: '十位', forceDir: 'asc',  blankMode: 'last' },
            { step: 20,   placeValue: 10,   placeName: '十位', forceDir: 'desc', blankMode: 'last' },
            { step: 20,   placeValue: 10,   placeName: '十位', forceDir: null,   blankMode: 'last' },
            { step: 20,   placeValue: 10,   placeName: '十位', forceDir: null,   blankMode: 'any'  },
            { step: 100,  placeValue: 100,  placeName: '百位', forceDir: 'asc',  blankMode: 'last' },
            { step: 100,  placeValue: 100,  placeName: '百位', forceDir: 'desc', blankMode: 'last' },
            { step: 100,  placeValue: 100,  placeName: '百位', forceDir: null,   blankMode: 'last' },
            { step: 100,  placeValue: 100,  placeName: '百位', forceDir: null,   blankMode: 'any'  },
            { step: 200,  placeValue: 100,  placeName: '百位', forceDir: 'asc',  blankMode: 'last' },
            { step: 200,  placeValue: 100,  placeName: '百位', forceDir: 'desc', blankMode: 'last' },
            { step: 200,  placeValue: 100,  placeName: '百位', forceDir: null,   blankMode: 'last' },
            { step: 200,  placeValue: 100,  placeName: '百位', forceDir: null,   blankMode: 'any'  },
            { step: 1000, placeValue: 1000, placeName: '千位', forceDir: 'asc',  blankMode: 'last' },
            { step: 1000, placeValue: 1000, placeName: '千位', forceDir: 'desc', blankMode: 'last' },
            { step: 1000, placeValue: 1000, placeName: '千位', forceDir: null,   blankMode: 'last' },
            { step: 1000, placeValue: 1000, placeName: '千位', forceDir: null,   blankMode: 'any'  }
        ];
        const QUESTIONS_PER_TIER = 4;
        let questionCount = 0;
        let currentStep = 10, currentPlaceValue = 10, currentPlaceName = '十位', currentUnitChange = 1;
        function getDifficultyForQuestion() {
            const tierIndex = Math.min(Math.floor(questionCount / QUESTIONS_PER_TIER), DIFFICULTY_TIERS.length - 1);
            return DIFFICULTY_TIERS[tierIndex];
        }

        let gameStarted = false;
        let currentAns, score = 0;
        let gameInterval = null;
        let nextQuestionTimeout = null;
        let activeOptions = [];
        let isAnswered = false;
        let isPaused = false;
        let audioCtx = null;
        let optionsArr = [];
        let trainSequence = [];
        let currentQuestionText = "看看火車車廂，空格的數字是多少呢？";
        let hintLevel = 0;
        let hintActiveValue = null;
        let pendingNextQuestion = false;

        // 速度等級設定
        let speedLevel = 2; 
        const speedDurations = [0, 6.0, 4.0, 2.5, 1.5];
        const speedNames = ["", "慢速", "正常", "快速", "極速"];

        function adjustSpeed(delta) {
            speedLevel += delta;
            if (speedLevel < 1) speedLevel = 1;
            if (speedLevel > 4) speedLevel = 4;

            document.getElementById('speed-display').innerText = speedNames[speedLevel];
            
            activeOptions.forEach(el => {
                el.style.animationDuration = speedDurations[speedLevel] + 's';
            });
        }

        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
            try {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'zh-TW';
                if (onEnd) { msg.onend = onEnd; msg.onerror = onEnd; }
                window.speechSynthesis.speak(msg);
            } catch(e) { if (onEnd) onEnd(); }
        }

        function repeatCurrentQuestion() {
            speak(currentQuestionText);
        }

        function playSuccessSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(350, audioCtx.currentTime);
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime + 0.15); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.3);  
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playErrorSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function showCompletionScreen() {
            document.getElementById('completeEquation').innerText = trainSequence.join(' , ');
            document.getElementById('completeOverlay').style.display = 'flex';
        }
        function hideCompletionScreen() {
            document.getElementById('completeOverlay').style.display = 'none';
        }

        function restartGame() {
            isPaused = false;
            pendingNextQuestion = false;
            gameStarted = false;
            questionCount = 0;
            if (gameInterval) clearInterval(gameInterval);
            if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
            activeOptions.forEach(el => el.remove());
            activeOptions = [];
            hideCompletionScreen();
            try { window.speechSynthesis.cancel(); } catch(e) {}
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
        }

        function startGame() {
            if (document.getElementById('home-screen').style.display === 'none') return;
            gameStarted = true;
            questionCount = 0;

            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass && !audioCtx) {
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
                }
            } catch(e) {}

            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            
            score = 0;
            isPaused = false;
            
            const pauseBtn = document.getElementById('pause-btn');
            pauseBtn.innerText = "暫停遊戲";
            pauseBtn.style.backgroundColor = "#d97706";

            document.getElementById('score').innerText = `闖關: ${score}`;
            loadQuestion();
        }

        function togglePause() {
            if (!gameStarted) return;
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pause-btn');
            
            if (isPaused) {
                pauseBtn.innerText = "繼續遊戲";
                pauseBtn.style.backgroundColor = "#16a34a";
                document.getElementById('feedback').innerText = "⏸️ 遊戲已暫停，慢慢思考喔！";
                activeOptions.forEach(el => el.style.animationPlayState = 'paused');
                if (gameInterval) clearInterval(gameInterval);
                if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
                try { window.speechSynthesis.cancel(); } catch(e) {}
            } else {
                pauseBtn.innerText = "暫停遊戲";
                pauseBtn.style.backgroundColor = "#d97706";
                document.getElementById('feedback').innerText = "▶️ 遊戲繼續！加油！";
                activeOptions.forEach(el => el.style.animationPlayState = 'running');
                if (pendingNextQuestion) {
                    // 答對後正在等待進下一題的空檔被暫停了，恢復時直接進下一題，
                    // 不會重新啟動一個新的等待計時器（避免連跳兩題）。
                    pendingNextQuestion = false;
                    hideCompletionScreen();
                    loadQuestion();
                } else if (isAnswered) {
                    loadQuestion();
                } else {
                    startSpawning();
                }
            }
        }

        // 依「安全範圍」選一個位值數字，確保不管加或減 STEP 三次，
        // 該位數字都不會超出 0~9（或千位的 1~9），不會意外借位牽動其他位數。
        function safeDigit(minD, maxD, isAscending) {
            let lo, hi;
            if (isAscending) { lo = minD; hi = maxD - 3 * currentUnitChange; }
            else { lo = minD + 3 * currentUnitChange; hi = maxD; }
            if (hi < lo) hi = lo;
            return lo + Math.floor(Math.random() * (hi - lo + 1));
        }

        function loadQuestion() {
            isAnswered = false;
            hintLevel = 0;
            hintActiveValue = null;
            if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
            hideCompletionScreen();

            if (!isPaused) {
                document.getElementById('feedback').innerText = `觀察${currentPlaceName}的變化，找出空格數字！`;
            }
            
            activeOptions.forEach(el => el.remove());
            activeOptions = [];
            if (gameInterval) clearInterval(gameInterval);

            const tier = getDifficultyForQuestion();
            questionCount++;
            const STEP = tier.step;
            const PLACE_VALUE = tier.placeValue;
            currentStep = STEP;
            currentPlaceValue = PLACE_VALUE;
            currentPlaceName = tier.placeName;
            currentUnitChange = STEP / PLACE_VALUE;

            let isAscending = tier.forceDir === 'asc' ? true
                : tier.forceDir === 'desc' ? false
                : Math.random() < 0.5;

            let baseTh, baseH, baseT, baseU;
            baseU = Math.floor(Math.random() * 9) + 1; // 個位固定不變，純粹填充用

            if (PLACE_VALUE === 1000) {
                baseTh = safeDigit(1, 9, isAscending);      // 千位在變化，且不能變成3位數
                baseH = Math.floor(Math.random() * 9) + 1;
                baseT = Math.floor(Math.random() * 10);
            } else if (PLACE_VALUE === 100) {
                baseTh = Math.floor(Math.random() * 8) + 1;
                baseH = safeDigit(0, 9, isAscending);        // 百位在變化
                baseT = Math.floor(Math.random() * 10);
            } else {
                baseTh = Math.floor(Math.random() * 8) + 1;
                baseH = Math.floor(Math.random() * 9) + 1;
                baseT = safeDigit(0, 9, isAscending);        // 十位在變化
            }

            let startNum = baseTh * 1000 + baseH * 100 + baseT * 10 + baseU;
            let actualStep = isAscending ? STEP : -STEP;

            trainSequence = [];
            for (let i = 0; i < 4; i++) {
                trainSequence.push(startNum + (i * actualStep));
            }

            let blankIndex = tier.blankMode === 'last'
                ? 3
                : Math.floor(Math.random() * 4);
            currentAns = trainSequence[blankIndex];

            renderTrain(trainSequence, blankIndex);
            
            currentQuestionText = `看看火車車廂，空格的數字是多少呢？`;
            speak(currentQuestionText);

            // 產生干擾選項，並排除跟畫面上其他車廂重複的數字，
            // 這樣小朋友才是靠算出答案，而不是靠「這個數字已經出現過了」用消去法猜對。
            let visibleValues = new Set(trainSequence.filter((v, idx) => idx !== blankIndex));
            let options = new Set([currentAns]);
            let attempts = 0;
            while (options.size < 4 && attempts < 50) {
                attempts++;
                let offsetMultiplier = (Math.floor(Math.random() * 7) - 3); // -3 ~ 3
                let randVal = currentAns + (offsetMultiplier * STEP);
                if (offsetMultiplier !== 0 && randVal >= 1000 && randVal <= 9999
                    && !options.has(randVal) && !visibleValues.has(randVal)) {
                    options.add(randVal);
                }
            }
            // 保險：萬一還是湊不滿4個（機率極低），往上下兩個方向找鄰近安全值補滿，
            // 一定會在有限次數內結束，不會卡住。
            let fallbackMag = STEP;
            let safety = 0;
            while (options.size < 4 && safety < 200) {
                safety++;
                let up = currentAns + fallbackMag;
                let down = currentAns - fallbackMag;
                if (up <= 9999 && !options.has(up) && !visibleValues.has(up)) options.add(up);
                if (options.size < 4 && down >= 1000 && !options.has(down) && !visibleValues.has(down)) options.add(down);
                fallbackMag += STEP;
            }
            // 最終保底：極端情況下還是不足4個，用任何未使用過的0~9999內數字補滿
            let filler = 1000;
            while (options.size < 4 && filler <= 9999) {
                if (!options.has(filler) && !visibleValues.has(filler)) options.add(filler);
                filler++;
            }
            optionsArr = Array.from(options).sort(() => Math.random() - 0.5);

            startSpawning();
        }

        function startSpawning() {
            if (isPaused || isAnswered) return;
            if (gameInterval) clearInterval(gameInterval);
            let index = 0;
            gameInterval = setInterval(() => {
                if (isPaused) return; 
                if (isAnswered) {
                    clearInterval(gameInterval);
                    return;
                }
                if (index >= optionsArr.length) index = 0;
                spawnFallingOption(optionsArr[index]);
                index++;
            }, 2000);
        }

        function renderTrain(seq, blankIdx) {
            let area = document.getElementById('visual-area');
            area.innerHTML = '';
            
            seq.forEach((num, idx) => {
                let carriage = document.createElement('div');
                carriage.className = 'train-carriage';

                let box = document.createElement('div');
                box.className = 'train-box';
                
                let windowDiv = document.createElement('div');
                windowDiv.className = 'train-window';

                if (idx === blankIdx) {
                    box.classList.add('target');
                    windowDiv.innerText = '?';
                    windowDiv.id = 'trainTarget';
                } else {
                    windowDiv.innerHTML = formatNumberDigits(num, false);
                }
                box.appendChild(windowDiv);
                carriage.appendChild(box);

                let wheels = document.createElement('div');
                wheels.className = 'train-wheels';
                wheels.innerHTML = '<div class="wheel"></div><div class="wheel"></div>';
                carriage.appendChild(wheels);

                area.appendChild(carriage);

                if (idx < seq.length - 1) {
                    let connector = document.createElement('div');
                    connector.className = 'train-connector';
                    area.appendChild(connector);
                }
            });
        }

        // 把數字拆成一位一位顯示，highlight=true 時，會把「正在變化的那一位」
        // （十位/百位/千位，依目前難度而定）用顏色特別標出來，
        // 讓孩子一眼就看出規律藏在哪一位數字上，而不是只用嘴巴講。
        function formatNumberDigits(num, highlight) {
            const s = String(num).padStart(4, '0');
            const digitIdx = currentPlaceValue === 1000 ? 0 : currentPlaceValue === 100 ? 1 : 2;
            let html = '';
            for (let i = 0; i < s.length; i++) {
                if (highlight && i === digitIdx) {
                    html += `<span class="digit-highlight">${s[i]}</span>`;
                } else {
                    html += s[i];
                }
            }
            return html;
        }

        // 三段式提示：第一次給文字線索（利用旁邊車廂的數字），
        // 第二次視覺標示出正在變化的那一位數字，第三次才直接公布答案。
        function useHint() {
            if (isPaused || isAnswered || !gameStarted) return;
            hintLevel++;
            let blankIndex = trainSequence.indexOf(currentAns);
            let isAscending = trainSequence.length > 1 && trainSequence[1] > trainSequence[0];

            if (hintLevel === 1) {
                let neighborVal, direction;
                if (blankIndex > 0) {
                    neighborVal = trainSequence[blankIndex - 1];
                    direction = isAscending ? `多 ${currentStep}` : `少 ${currentStep}`;
                } else {
                    neighborVal = trainSequence[blankIndex + 1];
                    direction = isAscending ? `少 ${currentStep}` : `多 ${currentStep}`;
                }
                const text = `🔍 提示：旁邊車廂是 ${neighborVal}，這一格要比它${direction}喔！`;
                document.getElementById('feedback').innerText = text;
                speak(text.replace('🔍 提示：', ''));
            } else if (hintLevel === 2) {
                // 把畫面上所有看得到的車廂，重新用「標示出正在變化那一位」的方式呈現，
                // 讓孩子親眼看到規律藏在十位／百位／千位的哪一格，而不是只用嘴巴講。
                trainSequence.forEach((num, idx) => {
                    if (idx === blankIndex) return;
                    const el = document.querySelectorAll('.train-window')[idx];
                    if (el) el.innerHTML = formatNumberDigits(num, true);
                });
                const text = `👀 提示：仔細看，${currentPlaceName}那格數字每次都在變化！`;
                document.getElementById('feedback').innerText = text;
                speak(`仔細看，${currentPlaceName}那格數字每次都在變化`);
            } else {
                const text = `💡 答案是 ${currentAns}！在畫面上找找看這個數字！`;
                document.getElementById('feedback').innerText = text;
                speak(`答案是 ${currentAns}，找找看畫面上的這個數字！`);
                hintActiveValue = currentAns;
                activeOptions.forEach(opt => {
                    if (opt.innerText.trim() === String(currentAns)) {
                        opt.classList.add('hint-glow');
                    }
                });
            }
        }

        function spawnFallingOption(val) {
            if (isAnswered) return;
            const container = document.getElementById('drop-game-container');
            const el = document.createElement('div');
            el.className = 'falling-option';
            el.innerText = val;
            if (hintActiveValue !== null && val === hintActiveValue) {
                el.classList.add('hint-glow');
            }

            const randomX = Math.random() * (container.clientWidth - 64);
            el.style.left = randomX + 'px';
            
            el.style.animationDuration = speedDurations[speedLevel] + 's';

            if (isPaused) el.style.animationPlayState = 'paused';

            let isHandled = false;
            const handleSelect = function(e) {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                if (isAnswered || isPaused || isHandled) return;
                isHandled = true;

                if (val === currentAns) {
                    isAnswered = true;
                    score++;
                    document.getElementById('score').innerText = `闖關: ${score}`;
                    
                    playSuccessSound();
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });

                    let targetBox = document.getElementById('trainTarget');
                    if (targetBox) {
                        targetBox.innerText = currentAns;
                        targetBox.style.background = '#86efac';
                        targetBox.style.borderColor = '#16a34a';
                        targetBox.style.color = '#166534';
                        targetBox.parentElement.style.background = '#22c55e';
                        targetBox.parentElement.style.borderColor = '#15803d';
                    }

                    document.getElementById('feedback').innerText = "🎉 太棒了！火車順利開走了！";

                    clearInterval(gameInterval);
                    activeOptions.forEach(opt => opt.remove());
                    activeOptions = [];

                    showCompletionScreen();
                    pendingNextQuestion = true;

                    const goNext = () => {
                        if (!pendingNextQuestion) return;
                        if (isPaused) return; // 暫停中，交給暫停鍵的邏輯接手
                        if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
                        pendingNextQuestion = false;
                        loadQuestion();
                    };

                    // 語音講完之後再多停留 1 秒，讓小朋友看清楚畫面，才進下一題
                    speak(`答對了，就是 ${currentAns}！`, () => {
                        if (!pendingNextQuestion) return;
                        if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
                        nextQuestionTimeout = setTimeout(goNext, 1000);
                    });
                    // 保險：語音若無法播放，最多等 6 秒還是會自動進下一題
                    if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
                    nextQuestionTimeout = setTimeout(goNext, 6000);
                } else {
                    playErrorSound();
                    currentQuestionText = "再算算看喔！";
                    speak(currentQuestionText);
                    document.getElementById('feedback').innerText = "❌ 數字不對喔，再試一次！";
                    el.style.opacity = "0";
                    setTimeout(() => el.remove(), 300);
                }
            };

            el.addEventListener('pointerdown', handleSelect);

            el.addEventListener('animationend', () => {
                el.remove();
                activeOptions = activeOptions.filter(item => item !== el);
            });

            container.appendChild(el);
            activeOptions.push(el);
        }

    </script>
</body>
</html>
